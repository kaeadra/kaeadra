            ${c.n ? '<span class="pill ' + (c.sev === 'bad' ? 'out' : 'low') + '">' + c.n + '</span>' : ''}
          </div>`).join('')
        : emptyBox('كل شيء سليم', 'لا تناقضات في الكميات ولا الأرصدة ولا القيود.', 'check')}
      </div>
    </section>

    <section class="card">
      <div class="pad" style="padding-bottom:6px"><div class="sec-h" style="margin-bottom:0"><h2>سجل العمليات</h2>
        <span class="eyebrow">${monthLabel(S.month)}</span></div>
        <p class="hint" style="margin:6px 0 0">يُسجَّل هنا كل حذف أو شطب دين أو تعديل إعدادات أو صلاحيات أو تسوية صندوق.</p></div>
      <div class="list">
        ${aud.length ? aud.slice().reverse().slice(0, 60).map(x => `
          <div class="item"><span class="rowic" style="background:var(--warn-soft);color:var(--warn)">${svg('clip')}</span>
            <span class="grow"><span class="t">${esc(x.action)}</span>
              <span class="m"><span class="mono">${esc(x.date)} · ${esc(x.time || '')}</span>
                <span class="pill acc">${esc(x.by || '—')}</span>
                ${x.detail ? '<span>' + esc(x.detail) + '</span>' : ''}</span></span>
            ${x.payload && x.payload.sale ? '<button class="btn sm" data-act="reenter" data-id="' + esc(x.id) + '" type="button">إعادة إدخال</button>' : ''}
          </div>`).join('') : emptyBox('لا عمليات مسجّلة', 'سجل العمليات يبدأ بأول حذف أو تعديل حسّاس.', 'clip')}
      </div>
    </section>

    <section class="card pad">
      <div class="sec-h"><h2>من يصل إلى البيانات</h2></div>
      <div class="banner"><span class="bic">${svg('shield')}</span>
        <span><b>البيانات محفوظة على خادم claude.ai ضمن حسابك</b>لا يفتحها إلا من شاركته الرابط صراحةً، ولا تظهر لأحد غيرهم.
        عند المشاركة اختر «العرض فقط» للعامل: عندها لا يستطيع تعديل الإعدادات أو رأس المال أو حصص الشركاء أو الحسابات والصلاحيات — الخادم يمنعه، لا البرنامج.
        و«التعديل» للشريك فقط.</span></div>
      <div class="banner warn" style="margin-top:10px"><span class="bic">${svg('shieldx')}</span>
        <span><b>ما لا يحميه هذا النظام</b>من تعطيه الرابط يرى البيانات اليومية (المبيعات والجرد والديون).
        صلاحيات العمال داخل البرنامج تنظّم العمل وتمنع الخطأ، لكنها لا تصدّ من يعرف أدوات المتصفح.
        لفصل الأرباح والتكاليف عن العامل فصلاً تاماً يلزم خادم مستقل بتسجيل دخول حقيقي.</span></div>
    </section>
  </div>`;
}

/* ---------- 11. الصندوق والأرصدة ---------- */
function viewCash() {
  const b = book(S.month);
  const exps = (b.expenses || []);
  const spend = exps.filter(x => x.kind === 'expense').reduce((s, x) => s + n(x.amount), 0);
  const draws = exps.filter(x => x.kind === 'withdrawal').reduce((s, x) => s + n(x.amount), 0);
  const sitesTotal = S.sites.reduce((s, x) => s + n(x.balance), 0);

  return `
  ${kpi([
    { k: 'مصاري بدرج', v: usd(S.cash), s: tryv(toTRY(S.cash)), tone: 'acc', i: 'cash' },
    { k: 'أرصدة المواقع والبنك', v: usd(sitesTotal), i: 'wallet', tone: 'vio' },
    { k: 'مصاريف ' + monthLabel(S.month), v: usd(spend), tone: 'neg', i: 'alert' },
    { k: 'مسحوبات الشركاء', v: usd(draws), tone: 'neg', i: 'users' }
  ])}

  <div class="stack" style="margin-top:14px">
    <section class="card">
      <div class="pad"><div class="sec-h"><h2>أرصدة المواقع والبنوك</h2>
        <button class="btn primary sm" data-act="newsite" type="button">+ رصيد</button></div>
        <p class="hint" style="margin:0">عند بيع رقم افتراضي أو كوينز أو رصيد شريحة مرتبط بحساب، يُخصم مبلغ التكلفة من رصيد ذلك الحساب تلقائياً.</p></div>
      <div class="pad" style="padding-top:0">
        ${S.sites.length ? `<div class="wallets">${S.sites.map(x => `
          <button class="wallet ${x.isPay ? '' : 'buy'}" type="button" data-act="site" data-id="${x.id}">
            <div class="wic">${svg(x.isPay ? 'wallet' : 'sim')}</div>
            <div class="wn">${esc(x.name)}</div>
            <div class="wb">${money(x.balance)} <span style="font-size:.62em;color:var(--muted)">$</span></div>
            <div class="wf"><span>${x.isPay ? 'حساب دفع' : 'رصيد شراء'}</span>
              ${n(x.balance) <= n(x.minBal || 0) ? '<span class="pill low">منخفض</span>' : '<span>' + esc(x.note || '') + '</span>'}</div>
          </button>`).join('')}</div>
          <div class="invtot big" style="margin-top:14px"><span>مجموع الأرصدة</span><b>${money(sitesTotal)} $</b></div>`
          : emptyBox('لا حسابات بعد', 'أضف شام كاش، سرمدا كارد، 5sim، MTN، أو حساباً بنكياً.', 'wallet')}
      </div>
    </section>

    <section class="card">
      <div class="pad"><div class="sec-h"><h2>مسحوبات الشركاء وحركة الصندوق</h2>
        <div class="row">${can('spend') ? '<button class="btn sm" data-nav="spend" type="button">الاستهلاك والمصاريف ↩</button>' : ''}
        <button class="btn primary sm" data-act="newdraw" type="button">+ مسحوبات</button></div></div></div>
      <div class="list">
        ${exps.length ? exps.slice().reverse().map(expRow).join('') : emptyBox('لا حركة هذا الشهر', 'المسحوبات وشحن الأرصدة والتسويات تظهر هنا.', 'inbox')}
      </div>
    </section>

    <section class="card">
      <div class="pad"><div class="sec-h"><h2>تسوية الصندوق</h2></div>
      <p class="hint" style="margin:0 0 10px">إذا اختلف المبلغ الفعلي في الدرج عن المسجّل، صحّحه هنا ويُسجَّل الفرق كقيد تسوية.</p>
      <button class="btn" data-act="recon" type="button">تسوية المبلغ النقدي</button></div>
    </section>
  </div>`;
}
function expRow(x) {
  const label = x.kind === 'withdrawal' ? 'مسحوبات' : x.kind === 'topup' ? 'شحن رصيد' : x.kind === 'recon' ? 'تسوية صندوق' : (x.cat || 'مصروف');
  const noCashPill = x.noCash ? '<span class="pill out">شطب دين — بلا نقد</span>' : '';
  return `<div class="item"><span class="stripe ${x.kind === 'withdrawal' ? 'warn' : x.kind === 'topup' ? 'acc' : 'bad'}"></span>
    <span class="grow"><span class="t">${esc(x.who || label)}</span>
      <span class="m"><span class="mono">${esc(x.date)}${x.time ? ' · ' + esc(x.time) : ''}</span><span>${esc(label)}</span>
      ${x.seller ? '<span class="pill acc">' + esc(x.seller) + '</span>' : ''}
      ${noCashPill}
      ${x.destId && !x.noCash ? '<span class="pill neutral">' + esc(x.destName || destName(x.destId)) + '</span>' : ''}
      ${x.note ? '<span>' + esc(x.note) + '</span>' : ''}</span></span>
    <span class="amt">${money(x.amount)} $</span>
    ${can('delete') ? '<button class="btn ghost sm" data-act="delexp" data-id="' + x.id + '" type="button" aria-label="حذف">✕</button>' : ''}</div>`;
}
</script>
<script>
/* ---------- 12. التقارير ---------- */
S.summaries = null;
async function ensureSummaries() {
  if (S.summaries) return;
  S.summaries = [];
  const rows = await Store.list('summary');
  S.summaries = rows.sort((a, b) => String(a.id).localeCompare(String(b.id)));
  if (S.view === 'report') render();
}

function balanceSheet() {
  const st = stockStats();
  const sites = S.sites.reduce((s, x) => s + n(x.balance), 0);
  const other = (S.settings.otherAssets || []).reduce((s, x) => s + n(x.value), 0);
  const recv = S.parties.filter(p => n(p.bal) > 0).reduce((s, p) => s + n(p.bal), 0);
  const pay  = S.parties.filter(p => n(p.bal) < 0).reduce((s, p) => s - n(p.bal), 0);
  const cash = n(S.cash);
  const drawn = (S.settings.partners || []).reduce((s, p) => s + n(p.drawn), 0);
  const assets = st.cost + sites + other + recv + cash + drawn;
  const capital = n(S.settings.capital);
  const profit = assets - pay - capital;
  return { inv: st.cost, sites, other, recv, pay, cash, drawn, assets, capital, profit };
}

function viewReport() {
  ensureSummaries();
  const b = book(S.month);
  const sm = summarize(b);
  const bs = balanceSheet();
  const shareOf = p => bs.profit * partnerShare(p);

  /* أفضل الأصناف ربحاً في الشهر */
  const agg = {};
  (b.sales || []).forEach(s => (s.lines || []).forEach(l => {
    const k = l.pid || ('free:' + l.name);
    agg[k] = agg[k] || { name: l.name, qty: 0, rev: 0, profit: 0 };
    agg[k].qty += n(l.qty);
    agg[k].rev += n(l.price) * n(l.qty);
    agg[k].profit += (n(l.price) - n(l.cost)) * n(l.qty);
  }));
  const top = Object.values(agg).sort((a, b2) => b2.profit - a.profit).slice(0, 10);

  /* المبيعات حسب البائع */
  const sellers = {};
  (b.sales || []).forEach(x => {
    const k = x.seller || 'غير محدَّد';
    sellers[k] = sellers[k] || { name: k, count: 0, rev: 0, profit: 0, debt: 0 };
    sellers[k].count++; sellers[k].rev += n(x.total); sellers[k].profit += n(x.profit);
    sellers[k].debt += Math.max(0, n(x.total) - n(x.paid));
  });
  const sellerRows = Object.values(sellers).sort((a, c) => c.rev - a.rev);

  /* المبيعات حسب طريقة الدفع — المقبوض موزّع على وجهته، والباقي دين */
  const pays = {};
  const bump = (k, v) => { if (!v) return; pays[k] = (pays[k] || 0) + v; };
  (b.sales || []).forEach(x => {
    bump(x.destId ? (x.destName || destName(x.destId)) : 'كاش في الدرج', n(x.paid));
    bump('بقي ديناً على الزبائن', Math.max(0, n(x.total) - n(x.paid)));
  });
  const payRows = Object.keys(pays).map(k => ({ name: k, amount: r2(pays[k]) })).sort((a, c) => c.amount - a.amount);

  return `
  <div class="eyebrow" style="margin-bottom:9px">تقرير ${monthLabel(S.month)}</div>
  ${kpi([
    { k: 'صافي المبيعات', v: usd(sm.revenue), s: sm.count + ' فاتورة' + (sm.returnsCount ? ' · بعد ' + sm.returnsCount + ' مرتجع' : ''), tone: 'acc', i: 'bag' },
    { k: 'تكلفة البضاعة المباعة', v: usd(sm.cost), i: 'box', tone: 'amb' },
    { k: 'الربح الإجمالي', v: usd(sm.gross), tone: 'pos', i: 'trend' },
    { k: 'صافي الربح بعد المصاريف', v: usd(sm.net), tone: sm.net >= 0 ? 'pos' : 'neg', i: 'check' }
  ])}
  <div style="height:1px"></div>
  ${kpi([
    { k: 'المصاريف', v: usd(sm.expenses), tone: 'neg', i: 'alert' },
    { k: 'مقبوضات ديون', v: usd(sm.collected), tone: 'pos', i: 'coin' },
    { k: 'المرتجعات', v: usd(sm.returns), s: sm.returnsCount + ' مرتجع', tone: sm.returns > 0 ? 'neg' : 'pos', i: 'back' },
    { k: 'هامش الربح', v: '<span class="num">' + (sm.revenue ? r2(sm.gross / sm.revenue * 100) : 0) + '%</span>', i: 'trend', tone: 'amb' }
  ])}

  <div class="stack" style="margin-top:14px">
    <section class="card pad">
      <div class="sec-h"><h2>المبيعات اليومية</h2><span class="eyebrow">التكلفة + الربح = المبيعات</span></div>
      <div class="chartwrap"><div id="chartDaily"></div></div>
      <div class="legend">
        <span><i style="background:var(--chart-cost)"></i>تكلفة البضاعة</span>
        <span><i style="background:var(--chart-profit)"></i>الربح</span>
      </div>
    </section>

    <section class="card pad">
      <div class="sec-h"><h2>صافي الربح شهرياً</h2><span class="eyebrow">آخر ١٢ شهراً</span></div>
      <div class="chartwrap"><div id="chartMonthly"></div></div>
      <p class="hint" style="margin:6px 0 0">يُحتسب من دفاتر المبيعات والمصاريف لكل شهر.</p>
    </section>

    <section class="card">
      <div class="pad" style="padding-bottom:6px"><div class="sec-h"><h2>المبيعات حسب البائع</h2>
        <span class="eyebrow">${monthLabel(S.month)}</span></div></div>
      <div class="tw"><table>
        <thead><tr><th>البائع</th><th>الفواتير</th><th>المبيعات $</th><th>الربح $</th><th>باع بالدين $</th></tr></thead>
        <tbody>${sellerRows.length ? sellerRows.map(t => `<tr><td>${esc(t.name)}</td><td class="n">${t.count}</td>
          <td class="n">${money(t.rev)}</td><td class="n" style="color:var(--good)">${money(t.profit)}</td>
          <td class="n"${t.debt > 0 ? ' style="color:var(--bad)"' : ''}>${money(t.debt)}</td></tr>`).join('')
          : '<tr><td colspan="5" style="color:var(--muted);padding:20px;text-align:center">لا مبيعات في هذا الشهر.</td></tr>'}</tbody>
      </table></div>
    </section>

    <section class="card">
      <div class="pad" style="padding-bottom:4px"><div class="sec-h"><h2>المبيعات حسب طريقة الدفع</h2></div></div>
      <div>
        ${payRows.map(t => `<div class="bank"><span>${esc(t.name)}</span><b>${money(t.amount)} $</b></div>`).join('')}
        <div class="bank total"><span>مجموع المبيعات</span><b>${money(sm.revenue)} $</b></div>
      </div>
    </section>

    <section class="card">
      <div class="pad" style="padding-bottom:6px"><div class="sec-h"><h2>الأصناف الأكثر ربحاً</h2></div></div>
      <div class="tw"><table>
        <thead><tr><th>الصنف</th><th>الكمية</th><th>المبيعات $</th><th>الربح $</th></tr></thead>
        <tbody>${top.length ? top.map(t => `<tr><td>${esc(t.name)}</td><td class="n">${money0(t.qty)}</td><td class="n">${money(t.rev)}</td><td class="n" style="color:var(--good)">${money(t.profit)}</td></tr>`).join('')
          : '<tr><td colspan="4" style="color:var(--muted);padding:20px;text-align:center">لا مبيعات في هذا الشهر.</td></tr>'}</tbody>
      </table></div>
    </section>

    <section class="card">
      <div class="pad" style="padding-bottom:4px"><div class="sec-h"><h2>الموجودات ورأس المال</h2>
        <span class="eyebrow">الوضع الحالي</span></div>
        <p class="hint" style="margin:0 0 8px">نفس حساب الجرد الذي تعمل به: مجموع الموجودات ناقص الدين على المحل ناقص رأس المال = المربح الكلي.</p></div>
      <div>
        <div class="bank"><span>بضاعة المحل (بالتكلفة)</span><b>${money(bs.inv)} $</b></div>
        <div class="bank"><span>أرصدة المواقع والبنك</span><b>${money(bs.sites)} $</b></div>
        ${(S.settings.otherAssets || []).map(a => `<div class="bank"><span>${esc(a.name)}</span><b>${money(a.value)} $</b></div>`).join('')}
        <div class="bank"><span>دينات للمحل</span><b>${money(bs.recv)} $</b></div>
        <div class="bank"><span>مصاري بدرج</span><b>${money(bs.cash)} $</b></div>
        <div class="bank"><span>مسحوبات الشركاء</span><b>${money(bs.drawn)} $</b></div>
        <div class="bank total"><span>مجموع الموجودات</span><b>${money(bs.assets)} $</b></div>
        <div class="bank"><span>ناقص: دين على المحل</span><b style="color:var(--bad)">−${money(bs.pay)} $</b></div>
        <div class="bank"><span>ناقص: رأس المال</span><b style="color:var(--bad)">−${money(bs.capital)} $</b></div>
        <div class="bank total"><span>المربح الكلي</span><b>${money(bs.profit)} $</b></div>
      </div>
      ${(S.settings.partners || []).length ? `
      <div class="tw" style="border-top:1px solid var(--line)"><table>
        <thead><tr><th>الشريك</th><th>الحصة</th><th>حصته من المربح $</th><th>مسحوباته $</th><th>الباقي عليه $</th></tr></thead>
        <tbody>${S.settings.partners.map(p => {
          const sh = shareOf(p);
          return `<tr><td>${esc(p.name)}</td><td class="n">${n(p.share)}%</td><td class="n">${money(sh)}</td><td class="n">${money(p.drawn)}</td><td class="n" style="color:${n(p.drawn) - sh > 0 ? 'var(--bad)' : 'var(--good)'}">${money(n(p.drawn) - sh)}</td></tr>`;
        }).join('')}</tbody>
      </table></div>` : ''}
    </section>
  </div>`;
}
viewReport.after = () => {
  const sel = $('#monthSel');
  if (sel) sel.onchange = async () => {
    S.month = sel.value;
    await loadMonth(S.month, true);
    watchCurrentMonth();
    render();
  };
};

function monthOptions() {
  const set = new Set([monthOf(), S.month]);
  (S.summaries || []).forEach(s => set.add(s.id));
  Object.keys(S.ledger).forEach(m => set.add(m));
  const now = new Date();
  for (let i = 0; i < 12; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    set.add(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
  }
  return Array.from(set).filter(Boolean).sort().reverse();
}

/* ---------- 13. الرسوم ---------- */
function niceTicks(max) {
  if (max <= 0) return { top: 10, step: 5 };
  const raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(x => x * mag).find(x => x >= raw) || mag * 10;
  return { top: Math.ceil(max / step) * step, step };
}

/* عرض الرسم = عرض الحاوية الفعلي، أو الحد الأدنى الذي تحتاجه الأعمدة (فيمرّر أفقياً) */
function chartWidth(id, need) {
  const el = document.getElementById(id);
  return Math.max(need, (el && el.clientWidth) || 560);
}
function drawCharts() {
  const b = book(S.month);
  const [y, mo] = S.month.split('-').map(Number);
  const days = new Date(y, mo, 0).getDate();
  const rows = Array.from({ length: days }, () => ({ cost: 0, profit: 0 }));
  (b.sales || []).forEach(s => {
    const i = dayNum(s.date) - 1;
    if (i >= 0 && i < days) { rows[i].cost += n(s.cost); rows[i].profit += n(s.profit); }
  });
  $('#chartDaily').innerHTML = stackedBars(
    rows.map((r, i) => ({ label: String(i + 1), a: Math.max(0, r.cost), b: Math.max(0, r.profit),
      title: (i + 1) + ' ' + monthLabel(S.month) + ' — مبيعات ' + money(r.cost + r.profit) + ' $ · ربح ' + money(r.profit) + ' $' })),
    { minW: chartWidth('chartDaily', days * 21), labelEvery: days > 20 ? 5 : 2 });

  const sums = (S.summaries || []).slice(-12);
  const live = summarize(b); live.month = S.month;
  const byMonth = new Map(sums.map(s => [s.id || s.month, s]));
  byMonth.set(S.month, live);
  const series = Array.from(byMonth.entries()).sort((a, c) => String(a[0]).localeCompare(String(c[0]))).slice(-12);
  $('#chartMonthly').innerHTML = series.length
    ? stackedBars(series.map(([m, s]) => ({ label: monthLabel(m).split(' ')[0].slice(0, 6), a: 0, b: Math.max(0, n(s.net)),
        title: monthLabel(m) + ' — صافي الربح ' + money(s.net) + ' $', value: n(s.net) })),
      { minW: chartWidth('chartMonthly', series.length * 56), labelEvery: 1, showValues: true })
    : emptyBox('لا بيانات شهرية بعد', 'يظهر الرسم بعد تسجيل مبيعات أول شهر.', 'trend');
}

function stackedBars(data, opt) {
  opt = opt || {};
  const W = opt.minW || 480, H = 210;
  const padAxis = 54, padFree = 12, padT = 18, padB = 30;   /* محور القيم على اليمين */
  const iw = W - padAxis - padFree, ih = H - padT - padB;
  const max = Math.max(...data.map(d => d.a + d.b), 0);
  const { top, step } = niceTicks(max);
  const gap = iw / Math.max(data.length, 1);
  const bw = Math.min(30, gap * 0.68);
  const yOf = v => padT + ih - (v / top) * ih;
  let g = '';
  for (let t = 0; t <= top + 1e-9; t += step) {
    const yy = yOf(t).toFixed(1);
    g += `<line x1="${padFree}" x2="${W - padAxis}" y1="${yy}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${W - padAxis + 8}" y="${(+yy + 3.5).toFixed(1)}" text-anchor="start" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${money0(t)}</text>`;
  }
  const base = padT + ih;
  let bars = '';
  data.forEach((d, i) => {
    const cx = W - padAxis - gap * (i + 1) + gap / 2 - bw / 2;   /* أول عنصر إلى اليمين */
    const hA = (d.a / top) * ih, hB = (d.b / top) * ih;
    const t = `<title>${esc(d.title || '')}</title>`;
    if (d.a > 0) bars += `<rect x="${cx.toFixed(1)}" y="${(base - hA).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(hA, 1).toFixed(1)}" fill="var(--chart-cost)" rx="2">${t}</rect>`;
    if (d.b > 0) bars += `<rect x="${cx.toFixed(1)}" y="${(base - hA - hB - (d.a > 0 ? 2 : 0)).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(hB, 1).toFixed(1)}" fill="var(--chart-profit)" rx="4">${t}</rect>`;
    if (d.a === 0 && d.b === 0) bars += `<rect x="${cx.toFixed(1)}" y="${(base - 1).toFixed(1)}" width="${bw.toFixed(1)}" height="1" fill="var(--grid)">${t}</rect>`;
    if (i % (opt.labelEvery || 1) === 0)
      bars += `<text x="${(cx + bw / 2).toFixed(1)}" y="${H - 11}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${esc(d.label)}</text>`;
    if (opt.showValues && (d.a + d.b) > 0)
      bars += `<text x="${(cx + bw / 2).toFixed(1)}" y="${(base - hA - hB - 6).toFixed(1)}" text-anchor="middle" font-size="9.5" fill="var(--ink-2)" font-family="IBM Plex Mono, monospace">${money0(d.value != null ? d.value : d.a + d.b)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
    style="display:block;min-width:${W}px;height:${H}px">
    ${g}<line x1="${padFree}" x2="${W - padAxis}" y1="${base}" y2="${base}" stroke="var(--line)" stroke-width="1"/>${bars}</svg>`;
}

/* ---------- 14ب. مسح الباركود ---------- */
let scanStop = null;
function scanSupported() { return typeof window.BarcodeDetector !== 'undefined'; }

async function openScanner(onCode) {
  modal('مسح الباركود',
    '<div id="scanBox" style="position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:4/3;max-width:100%">' +
      '<video id="scanVid" playsinline muted style="width:100%;height:100%;object-fit:cover"></video>' +
      '<div style="position:absolute;inset:18% 10%;border:2px solid var(--accent);border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.35)"></div>' +
    '</div>' +
    '<div class="hint" id="scanMsg">وجّه الكاميرا إلى الباركود…</div>' +
    '<div class="f"><label for="scanManual">أو اكتب الرقم يدوياً</label>' +
      '<input id="scanManual" type="text" inputmode="numeric" autocomplete="off" placeholder="رقم الباركود أو كود القطعة"></div>',
    () => { const v = mv('scanManual').trim(); if (v) { closeScanner(); onCode(v); } else closeScanner(); }, 'استخدم الرقم');

  const man = $('#scanManual');
  if (man) man.onkeydown = e => { if (e.key === 'Enter') { const v = man.value.trim(); if (v) { closeScanner(); onCode(v); } } };

  if (!scanSupported()) {
    $('#scanBox').hidden = true;
    $('#scanMsg').innerHTML = 'متصفحك لا يدعم قراءة الباركود بالكاميرا (يعمل على كروم في أندرويد والحاسوب). استخدم قارئ باركود موصولاً بالجهاز، أو اكتب الرقم يدوياً.';
    if (man) man.focus();
    return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } });
  } catch (e) {
    $('#scanBox').hidden = true;
    $('#scanMsg').innerHTML = 'تعذّر فتح الكاميرا — قد تكون الصلاحية مرفوضة أو الكاميرا مستخدَمة. اكتب الرقم يدوياً.';
    if (man) man.focus();
    return;
  }
  const vid = $('#scanVid');
  vid.srcObject = stream;
  await vid.play().catch(() => {});
  const det = new window.BarcodeDetector();
  let alive = true;
  scanStop = () => { alive = false; try { stream.getTracks().forEach(t => t.stop()); } catch (e) {} };
  const tick = async () => {
    if (!alive) return;
    try {
      const found = await det.detect(vid);
      if (found && found.length && found[0].rawValue) {
        const code = found[0].rawValue;
        closeScanner(); onCode(code); return;
      }
    } catch (e) { /* إطار غير صالح — تجاهل */ }
    if (alive) setTimeout(tick, 220);
  };
  tick();
}
function closeScanner() { if (scanStop) { scanStop(); scanStop = null; } closeModal(); }

/* الصنف الممسوح: يُضاف للفاتورة، أو يُعرض ربطه بقطعة إن كان مجهولاً */
function onScanned(code) {
  const prod = findByCode(code);
  if (prod) {
    if (!n(prod.price)) { toast('حدّد سعر بيع ' + prod.name + ' أولاً', true); handle('editprod', { id: prod.id }, null); return; }
    addToCart(prod.id);
    toast('أُضيف ' + prod.name);
    return;
  }
  if (!can('stock')) { toast('باركود غير معروف: ' + code, true); return; }
  modal('باركود غير معروف',
    '<div class="banner warn"><span class="bic">' + svg('scan') + '</span>' +
    '<span><b>' + esc(code) + '</b>هذا الباركود غير مربوط بأي قطعة. اربطه بقطعة موجودة أو أنشئ قطعة جديدة.</span></div>' +
    sel('sbProd', 'اربطه بقطعة موجودة', [{ v: '', t: '— اختر —' }].concat(
      S.products.map(p => ({ v: p.id, t: (p.sku ? p.sku + ' — ' : '') + p.name + (p.brand ? ' ' + p.brand : '') }))), ''),
    async () => {
      const pr = P(mv('sbProd'));
      if (!pr) { toast('اختر قطعة', true); return; }
      pr.barcode = String(code).trim();
      await saveProduct(pr);
      closeModal(); toast('رُبط الباركود بـ ' + pr.name);
    }, 'اربط');
}

/* ---------- 15. النوافذ ---------- */
let modalSubmit = null;
function modal(title, bodyHTML, onOk, okLabel) {
  modalSubmit = onOk;
  $('#modal').innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <header><h3>${esc(title)}</h3><button class="iconbtn" data-act="closemodal" type="button" aria-label="إغلاق">✕</button></header>
    <div class="body">${bodyHTML}</div>
    <footer><button class="btn" data-act="closemodal" type="button">إلغاء</button>
    <button class="btn primary" data-act="modalok" type="button">${esc(okLabel || 'حفظ')}</button></footer>
  </div></div>`;
  const first = $('#modal input, #modal select, #modal textarea');
  if (first) setTimeout(() => first.focus(), 30);
}
function closeModal() { $('#modal').innerHTML = ''; modalSubmit = null; }
const mv = id => { const e = $('#' + id); return e ? e.value : ''; };
const mc = id => { const e = $('#' + id); return e ? e.checked : false; };

document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalSubmit) closeModal(); });

function fld(id, label, type, val, extra) {
  return `<div class="f"><label for="${id}">${esc(label)}</label><input id="${id}" type="${type || 'text'}" ${extra || ''} value="${esc(val ?? '')}"></div>`;
}
function sel(id, label, options, val) {
  return `<div class="f"><label for="${id}">${esc(label)}</label><select id="${id}">${options.map(o =>
    `<option value="${esc(o.v)}"${String(o.v) === String(val) ? ' selected' : ''}>${esc(o.t)}</option>`).join('')}</select></div>`;
}
function sellerField(id) {
  const list = staffList();
  /* غير صاحب المحل لا ينسب حركةً لغيره */
  if (!list.length || !isOwner())
    return '<div class="f"><label for="' + id + '">البائع</label><input id="' + id + '" type="text" value="' +
      esc(who()) + '"' + (list.length ? ' readonly' : ' placeholder="اكتب الاسم"') + '></div>';
  const opts = (who() ? [] : [{ v: '', t: '— اختر البائع —' }]).concat(list.map(nm => ({ v: nm, t: nm })));
  return sel(id, 'البائع', opts, who());

const partyOptions = kind => [{ v: '', t: '— اختر —' }].concat(
  S.parties.filter(p => !kind || p.kind === kind).map(p => ({ v: p.id, t: p.name + ' (' + money(Math.abs(n(p.bal))) + '$)' })));
const siteOptions = () => [{ v: '', t: '— بدون —' }].concat(S.sites.map(s => ({ v: s.id, t: s.name })));

<script>
/* ---------- 16. الحفظ والتنزيل ---------- */
async function saveSettings(patch) {
  S.settings = Object.assign({}, S.settings, patch);
  await Store.set('meta/settings', S.settings);
  paintBrand();
}
/* رصيد الدرج حالة تشغيلية مستقلة عن الإعدادات، ليكتبها البائع دون أن
   يملك تعديل رأس المال أو حصص الشركاء (قواعد الوصول تمنعه من meta). */
const addCash = d => setCash(r2(n(S.cash) + n(d)));
async function setCash(v) { S.cash = r2(v); await Store.set('state/cash', { amount: S.cash, at: new Date().toISOString(), by: who() }); }
/* يدخل المبلغ (أو يخرج بقيمة سالبة) إلى الدرج أو إلى حساب مثل شام كاش */
async function receive(destId, amount) {
  if (!n(amount)) return;
  if (!destId) return addCash(amount);
  const st = SITE(destId);
  if (!st) return addCash(amount);
  st.balance = r2(n(st.balance) + n(amount));
  await saveSite(st);
}

/* سجل العمليات: من فعل ماذا ومتى — للحركات الحسّاسة فقط */
async function audit(action, detail, payload) {
  try {
    const rec = { id: uid('a'), date: todayStr(), time: nowTime(), ts: new Date().toISOString(),
      by: who() || '—', action, detail: detail || '', payload: payload || null };
    await Store.append('audit', rec.date, rec);
  } catch (e) { console.warn('audit', e); }
}

async function saveProduct(p) { await Store.set('products/' + p.id, p); }
async function saveParty(p)   { await Store.set('parties/' + p.id, p); }
async function saveSite(s)    { await Store.set('sites/' + s.id, s); }
async function bumpParty(id, delta) {
  const p = PARTY(id); if (!p) return;
  const before = n(p.bal);
  p.bal = r2(before + n(delta));
  /* عمر الدين يبدأ حين ينقلب الرصيد إلى مستحق لنا، وينتهي حين يُسدَّد */
  if (before <= 0 && p.bal > 0) p.debtSince = todayStr();
  if (p.bal <= 0) p.debtSince = '';
  await saveParty(p);
}

/* عمر الدين بالأيام، و— إن لم يُعرف تاريخ بدايته */
function debtAge(p) {
  if (n(p.bal) <= 0 || !p.debtSince) return null;
  const d = Math.floor((Date.now() - new Date(p.debtSince + 'T00:00:00').getTime()) / 86400000);
  return d >= 0 ? d : 0;
}
const AGE_BUCKETS = [
  { id: 'fresh', label: 'خلال ٣٠ يوماً', max: 30,       tone: 'ok'   },
  { id: 'd30',   label: 'متأخر ٣٠–٦٠',   max: 60,       tone: 'low'  },
  { id: 'd60',   label: 'متأخر ٦٠–٩٠',   max: 90,       tone: 'low'  },
  { id: 'd90',   label: 'أكثر من ٩٠ يوماً', max: Infinity, tone: 'out' }
];
const bucketOf = age => age === null ? null : AGE_BUCKETS.find(b => age < b.max) || AGE_BUCKETS[3];
/* ما تجاوز السقف: موجب = تجاوز */
const overLimit = p => n(p.limit) > 0 ? r2(n(p.bal) - n(p.limit)) : 0;

async function download(filename, text, mime) {
  try {
    const dl = await window.claude?.use?.('downloads');
    if (dl) { await dl.save({ filename, data: text }); toast('تم تجهيز الملف'); return; }
  } catch (e) {
    if (e && e.code === 'declined') return;
    console.warn(e);
  }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: mime || 'text/csv;charset=utf-8' }));
    a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (e) { toast('تعذّر التنزيل في هذا العرض', true); }
}
const csvCell = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const csv = rows => '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');

/* ---------- 17. منطق البيع ---------- */
function addToCart(pid) {
  const p = P(pid); if (!p) return;
  const found = S.cart.find(l => l.pid === pid);
  if (found) found.qty = n(found.qty) + 1;
  else S.cart.push({ pid, name: p.name + (p.brand ? ' ' + p.brand : ''), qty: 1, price: n(p.price), cost: n(p.cost) });
  posQuery = ''; render();
}

async function commitSale(data) {
  const lines = S.cart.map(l => ({ pid: l.pid || null, sku: (P(l.pid) || {}).sku || '', name: l.name, qty: n(l.qty), price: n(l.price), cost: n(l.cost) }))
                      .filter(l => n(l.qty) > 0);
  if (!lines.length) { toast('السلة فارغة', true); return; }
  const total = r2(lines.reduce((s, l) => s + l.price * l.qty, 0) - n(data.disc));
  const cost  = r2(lines.reduce((s, l) => s + l.cost  * l.qty, 0));
  if (!data.seller && staffList().length) { toast('اختر البائع قبل تسجيل الفاتورة', true); return; }
  const full = data.method === 'cash' || data.method === 'sham';
  const paid  = full ? total : r2(Math.min(n(data.paid), total));
  if (!full && !data.partyId) { toast('اختر الزبون لتسجيل الدين', true); return; }
  if (!full && data.partyId) {
    const pt = PARTY(data.partyId);
    const after = r2(n(pt.bal) + (total - paid));
    if (n(pt.limit) > 0 && after > n(pt.limit) &&
        !confirm(pt.name + ' سيتجاوز سقف دينه:\nالسقف ' + money(pt.limit) + ' $ — بعد هذه الفاتورة ' + money(after) + ' $\nهل تتابع؟')) return;
    if (pt.blacklist && !confirm(pt.name + ' ضمن القائمة السوداء. هل تتابع البيع بالدين؟')) return;
  }

  const party = PARTY(data.partyId);
  const sale = {
    id: uid('s'), date: data.date, ts: new Date().toISOString(), time: nowTime(),
    lines, total, cost, profit: r2(total - cost), disc: n(data.disc),
    paid, method: data.method, destId: data.destId || '', destName: destName(data.destId),
    seller: data.seller || who(),
    partyId: data.partyId || '', partyName: party ? party.name : '',
    note: data.note || ''
  };

  for (const l of lines) {
    if (!l.pid) continue;
    const p = P(l.pid); if (!p) continue;
    if (isStocked(p)) p.qty = r2(n(p.qty) - l.qty);
    if (p.siteId) { const st = SITE(p.siteId); if (st) { st.balance = r2(n(st.balance) - l.cost * l.qty); await saveSite(st); } }
    await saveProduct(p);
  }
  if (total - paid > 0 && data.partyId) await bumpParty(data.partyId, total - paid);
  await receive(sale.destId, paid);
  await Store.append('sales', sale.date, sale);
  S.ledger[monthOf(sale.date)] = null; await loadMonth(monthOf(sale.date), true);
  await saveSummary(monthOf(sale.date));
  S.summaries = null;
  S.cart = []; closeModal(); render();
  toast('تم تسجيل الفاتورة — ربح ' + money(sale.profit) + ' $');
}

async function reverseSale(id) {
  const b = book(S.month);
  const s = (b.sales || []).find(x => x.id === id);
  if (!s) return;
  for (const l of (s.lines || [])) {
    if (!l.pid) continue;
    const p = P(l.pid); if (!p) continue;
    if (isStocked(p)) p.qty = r2(n(p.qty) + n(l.qty));
    if (p.siteId) { const st = SITE(p.siteId); if (st) { st.balance = r2(n(st.balance) + n(l.cost) * n(l.qty)); await saveSite(st); } }
    await saveProduct(p);
  }
  if (n(s.total) - n(s.paid) > 0 && s.partyId) await bumpParty(s.partyId, -(n(s.total) - n(s.paid)));
  await receive(s.destId, -n(s.paid));
  await Store.mutate('sales', monthOf(s.date), id, () => null);
  await loadMonth(monthOf(s.date), true);
  await saveSummary(monthOf(s.date)); S.summaries = null;
  render(); toast('حُذفت الفاتورة وأُعيدت الكميات');
}

/* ---------- 18. معالج الأوامر ---------- */
/* الصلاحية المطلوبة لكل إجراء — يحمي حتى لو وصل أحدهم إلى زر مخفي */
const ACT_PERM = {
  addline: 'sell', pickadd: 'sell', freeline: 'sell', checkout: 'sell', scanpos: 'sell', retsale: 'sell',
  bulkprice: 'stock', scanfield: 'stock', expret: 'reports',
  newprod: 'stock', editprod: 'stock', delprod: 'stock', stocktake: 'stock', newprodquick: 'stock', expstock: 'stock',
  newpurchase: 'buy',
  newparty: 'debts', party: 'debts', payin: 'debts', payout: 'debts', delparty: 'debts', expdebts: 'debts',
  newsite: 'cash', site: 'cash', topup: 'cash', delsite: 'cash', recon: 'cash', newdraw: 'cash',
  newexp: 'spend', newdead: 'spend', newspendcat: 'spend', expspend: 'spend',
  delsale: 'delete', delexp: 'delete',
  savesettings: 'settings', newpartner: 'settings', editpartner: 'settings', delpartner: 'settings',
  newasset: 'settings', editasset: 'settings', delasset: 'settings', backup: 'settings',
  newuser: 'settings', edituser: 'settings', deluser: 'settings',
  expmonth: 'reports'
};

async function handle(act, ds, el, fromChange, ev) {
  if (['qtyset', 'price', 'cost'].includes(act) && !fromChange) return;
  const need = ACT_PERM[act];
  if (need && !can(need)) { toast('ليس لديك صلاحية لهذا الإجراء', true); return; }
  const i = +ds.i;
  switch (act) {

  /* تصفية */
  case 'poscat':      posCat = ds.v; render(); break;
  case 'reload': await Store.flush(); await loadMonth(S.month, true); S.summaries = null; S.backups = null; render(); toast('تم التحديث'); break;
  case 'netinfo': {
    const pend = Store.pending;
    modal('حالة الاتصال',
      '<div class="banner ' + (navigator.onLine ? '' : 'warn') + '"><span class="bic">' + svg('cloud') + '</span>' +
      '<span><b>' + (navigator.onLine ? 'متصل بالإنترنت' : 'غير متصل بالإنترنت') + '</b>' +
      (pend ? pend + ' حركة محفوظة على هذا الجهاز بانتظار الإرسال إلى الخادم. لا تُغلق البرنامج قبل إرسالها.'
            : 'كل الحركات مُرسَلة — لا شيء بانتظار الإرسال.') + '</span></div>' +
      '<p class="hint">تُحفظ كل حركة على الجهاز أولاً ثم تُرسَل. إن انقطع الإنترنت يستمر البيع، وتُرسَل الحركات تلقائياً فور عودته.</p>',
      async () => { await Store.flush(); paintNet(); closeModal(); toast(Store.pending ? 'ما زال ' + Store.pending + ' بانتظار الإرسال' : 'أُرسلت كل الحركات'); },
      'إرسال الآن'); break;
  }
  case 'mkbackup': {
    if (!isOwner()) { toast('النسخ الاحتياطي لصاحب المحل', true); break; }
    toast('جاري إنشاء النسخة…');
    const id = await makeBackup('manual');
    if (id) { await audit('إنشاء نسخة احتياطية', 'يدوية'); render(); toast('حُفظت النسخة'); }
    break;
  }
  case 'dlbackup': {
    if (!isOwner()) { toast('التنزيل لصاحب المحل', true); break; }
    const snap = await snapshot();
    snap.ledgerAll = {};
    for (const m of Object.keys(S.ledger)) snap.ledgerAll[m] = S.ledger[m];
    download('نسخة-دفتر-المحل-' + todayStr() + '.json', JSON.stringify(snap, null, 1), 'application/json');
    break;
  }
  case 'restore': {
    if (!isOwner()) { toast('الاستعادة لصاحب المحل', true); break; }
    const bk = (S.backups || []).find(x => x.id === ds.id);
    if (!bk) break;
    if (!confirm('استعادة بيانات ' + String(bk.at).slice(0, 16).replace('T', ' ') + '؟\nكل ما سُجّل بعد هذه النسخة في الضبط والأصناف والحسابات ودفاتر آخر شهرين سيُستبدل.')) break;
    toast('جاري الاستعادة…');
    await restoreBackup(ds.id);
    break;
  }
  case 'reenter': {
    const rec = (book(S.month).audit || []).find(x => x.id === ds.id);
    if (!rec || !rec.payload || !rec.payload.sale) break;
    if (!can('sell')) { toast('ليس لديك صلاحية البيع', true); break; }
    S.cart = (rec.payload.sale.lines || []).map(l => ({ pid: l.pid, sku: l.sku, name: l.name, qty: n(l.qty), price: n(l.price), cost: n(l.cost) }));
    go('pos'); toast('أُعيدت الأصناف إلى السلة — راجعها ثم أتمّ البيع');
    break;
  }
  case 'pickseller': {
    const u = me();
    modal('الحساب على هذا الجهاز',
      (u ? `<div class="userbtn" style="cursor:default"><span class="uav">${esc(u.name.trim()[0])}</span>
              <span style="min-width:0"><b>${esc(u.name)}</b><small>${esc(roleLabel(u))}</small></span></div>`
         : '<p class="hint">لا حسابات بعد — البرنامج مفتوح للجميع على هذا الجهاز.</p>') +
      '<p class="hint">يُسجَّل هذا الاسم على كل فاتورة ومصروف من هذا الجهاز.</p>' +
      '<div class="row">' +
        (S.users.length ? '<button class="btn" data-act="signout" type="button">تسجيل الخروج</button>' : '') +
        (isOwner() ? '<button class="btn" data-act="gostaff" type="button">إدارة الحسابات</button>' : '') +
      '</div>',
      () => closeModal(), 'تم'); break;
  }
  case 'gostaff': closeModal(); go('settings'); break;
  case 'newuser': case 'edituser': {
    if (!isOwner()) { toast('إدارة الحسابات لصاحب المحل فقط', true); break; }
    const u = act === 'edituser' ? S.users.find(x => x.id === ds.id) : null;
    const perms = u ? (u.role === 'owner' ? ALL_PERMS : (u.perms || [])) : ['sell'];
    modal(u ? 'حساب ' + u.name : 'حساب جديد',
      '<div class="grid2">' + fld('uName', 'الاسم', 'text', u ? u.name : '') +
        fld('uPin', u && u.pinHash ? 'رمز جديد (اتركه فارغاً للإبقاء)' : 'رمز الدخول (اختياري)', 'password', '', 'inputmode="numeric" maxlength="8" autocomplete="new-password"') + '</div>' +
      '<label class="row" style="gap:7px;font-size:13.5px"><input id="uOwner" type="checkbox" style="width:auto"' + (u && u.role === 'owner' ? ' checked' : '') + '> صاحب المحل — كل الصلاحيات دائماً</label>' +
      '<div class="f"><label>قوالب جاهزة</label><div class="chips">' +
        ROLE_PRESETS.filter(r => r.id !== 'owner').map(r =>
          `<button class="chip" type="button" data-preset="${r.id}">${esc(r.label)}</button>`).join('') + '</div></div>' +
      '<div class="f" id="uPerms"><label>الصلاحيات</label>' +
        PERMS.map(pm => `<label class="row" style="gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line-soft)">
          <input type="checkbox" data-perm="${pm.id}" style="width:auto"${perms.includes(pm.id) ? ' checked' : ''}>
          <span style="min-width:0"><b style="font-weight:600">${esc(pm.label)}</b>
            <span style="display:block;color:var(--muted);font-size:11.5px">${esc(pm.hint)}</span></span></label>`).join('') + '</div>' +
      (u ? '<label class="row" style="gap:7px;font-size:13.5px"><input id="uActive" type="checkbox" style="width:auto"' + (u.active !== false ? ' checked' : '') + '> الحساب فعّال</label>' : '') +
      (u && S.users.length > 1 ? '<button class="btn danger" data-act="deluser" data-id="' + esc(u.id) + '" type="button">حذف الحساب</button>' : ''),
      async () => {
        const nm = mv('uName').trim();
        if (!nm) { toast('أدخل الاسم', true); return; }
        const owner = mc('uOwner');
        const picked = $$('#uPerms [data-perm]').filter(c => c.checked).map(c => c.dataset.perm);
        if (!owner && !picked.length) { toast('اختر صلاحية واحدة على الأقل', true); return; }
        const list = S.users.slice();
        const obj = u ? Object.assign({}, u) : { id: uid('u'), active: true };
        obj.name = nm; obj.role = owner ? 'owner' : 'staff'; obj.perms = owner ? ALL_PERMS : picked;
        if (u) obj.active = mc('uActive');
        const pin = mv('uPin').trim();
        if (pin) { obj.pinSalt = newSalt(); obj.pinHash = await hashPin(pin, obj.pinSalt); }
        /* لا يجوز إلغاء آخر صاحب محل فعّال */
        const others = list.filter(x => x.id !== obj.id);
        if (!owner && !others.some(x => x.role === 'owner' && x.active !== false)) {
          toast('يجب أن يبقى صاحب محل واحد على الأقل', true); return;
        }
        const k = list.findIndex(x => x.id === obj.id);
        if (k >= 0) list[k] = obj; else list.push(obj);
        await saveUsers(list);
        await audit(u ? 'تعديل حساب مستخدم' : 'إنشاء حساب مستخدم',
          obj.name + ' · ' + (obj.role === 'owner' ? 'صاحب محل' : obj.perms.length + ' صلاحية') + (pin ? ' · غُيّر الرمز' : ''));
        if (!S.meId) signIn(obj.id);
        closeModal(); renderNav(); render(); toast('تم الحفظ');
      });
    $$('#modal [data-preset]').forEach(c => c.onclick = () => {
      const r = ROLE_PRESETS.find(x => x.id === c.dataset.preset);
      $('#uOwner').checked = false;
      $$('#uPerms [data-perm]').forEach(cb => cb.checked = r.perms.includes(cb.dataset.perm));
    });
    const ow = $('#uOwner');
    if (ow) ow.onchange = () => { if (ow.checked) $$('#uPerms [data-perm]').forEach(cb => cb.checked = true); };
    break;
  }
  case 'deluser': {
    const list = S.users.filter(x => x.id !== ds.id);
    if (!list.some(x => x.role === 'owner' && x.active !== false)) { toast('يجب أن يبقى صاحب محل واحد على الأقل', true); break; }
    if (!confirm('حذف الحساب؟')) break;
    await audit('حذف حساب مستخدم', (S.users.find(x => x.id === ds.id) || {}).name || ds.id);
    await saveUsers(list);
    if (S.meId === ds.id) signOut();
    closeModal(); renderNav(); render(); break;
  }
  case 'signout': signOut(); toast('سُجّل الخروج'); break;
  case 'gatepick': {
    const u = S.users.find(x => x.id === ds.id);
    if (!u) break;
    if (!u.pinHash) { signIn(u.id); toast('أهلاً ' + u.name); break; }
    gateUser = u.id; gateErr = ''; renderGate(); break;
  }
  case 'gateback': gateUser = ''; gateErr = ''; renderGate(); break;
  case 'gatepin': {
    const u = S.users.find(x => x.id === gateUser);
    if (!u) break;
    const h = await hashPin(mv('gatePin'), u.pinSalt);
    if (h === u.pinHash) { gateUser = ''; gateErr = ''; signIn(u.id); toast('أهلاً ' + u.name); }
    else { gateErr = 'الرمز غير صحيح'; renderGate(); }
    break;
  }
  case 'posmode':     posMode = ds.v; render(); break;
  case 'pickadd': {
    const prod = P($('#pkProd') ? $('#pkProd').value : posPick);
    if (!prod) { toast('اختر قطعة أولاً', true); return; }
    const qty = Math.max(1, n(mv('pkQty')) || 1);
    const price = n(mv('pkPrice')), cost = n(mv('pkCost'));
    if (price <= 0) { toast('أدخل سعر البيع', true); return; }
    if (isStocked(prod) && qty > n(prod.qty))
      toast('تنبيه: المتوفر ' + money0(prod.qty) + ' فقط — سُجّلت الكمية كما أدخلتها', true);
    /* أول سعر بيع يُدخَل للقطعة يُحفظ عليها، فلا تعيد إدخاله كل مرة */
    if (!n(prod.price) && price > 0) { prod.price = price; await saveProduct(prod); }
    const ex = S.cart.find(l => l.pid === prod.id && n(l.price) === price);
    if (ex) ex.qty = n(ex.qty) + qty;
    else S.cart.push({ pid: prod.id, name: prod.name + (prod.brand ? ' ' + prod.brand : ''), qty, price, cost });
    render(); toast('أُضيفت ' + qty + ' × ' + prod.name);
    break;
  }
  case 'stockcat':    stockCat = ds.v; render(); break;
  case 'stockfilter': stockFilter = ds.v; render(); break;
  case 'debtside':    debtSide = ds.v; debtAgeFilter = ''; render(); break;
  case 'debtage':     debtAgeFilter = ds.v; render(); break;

  /* السلة */
  case 'addline': addToCart(ds.id); break;
  case 'scanpos': openScanner(onScanned); break;
  case 'scanfield': {
    const t = $('#pBar');
    openScanner(code => { closeScanner(); if (t) t.value = code; toast('قُرئ ' + code); });
    break;
  }
  case 'qty':     S.cart[i].qty = Math.max(0, n(S.cart[i].qty) + n(ds.d)); render(); break;
  case 'qtyset':  S.cart[i].qty = Math.max(0, n(el.value)); render(); break;
  case 'price':   S.cart[i].price = n(el.value); render(); break;
  case 'cost':    S.cart[i].cost = n(el.value); render(); break;
  case 'rmline':  S.cart.splice(i, 1); render(); break;
  case 'clearcart': S.cart = []; render(); break;
  case 'freeline':
    modal('بند حر', fld('fName', 'اسم البند / الخدمة', 'text', '') +
      '<div class="grid3">' + fld('fQty', 'الكمية', 'number', 1, 'step="1" min="0"') +
      fld('fPrice', 'سعر البيع $', 'number', '', 'step="0.01"') +
      fld('fCost', 'التكلفة $', 'number', 0, 'step="0.01"') + '</div>' +
      '<p class="hint">استخدمه للأرقام الافتراضية والكوينز وشحن الرصيد والتصليح — أي شيء غير مسجّل في الجرد.</p>',
      () => {
        if (!mv('fName').trim()) { toast('أدخل اسم البند', true); return; }
        S.cart.push({ pid: null, name: mv('fName').trim(), qty: n(mv('fQty')) || 1, price: n(mv('fPrice')), cost: n(mv('fCost')) });
        closeModal(); render();
      }, 'إضافة'); break;

  case 'checkout': {
    const total = r2(S.cart.reduce((s, l) => s + n(l.price) * n(l.qty), 0));
    const methods = ['cash'].concat(shamSite() ? ['sham'] : []).concat(['debt', 'partial']);
    modal('إتمام البيع',
      `<div class="bank total" style="border-radius:8px;border:1px solid var(--accent-line)"><span>المطلوب</span><b>${money(total)} $ · ${money0(toTRY(total))} TL</b></div>` +
      '<div class="f"><label>طريقة الدفع</label><div class="chips" id="cMethods">' +
        methods.map((k, i) => `<button class="chip" type="button" data-m="${k}" aria-pressed="${i === 0}">${PAY[k].label}</button>`).join('') +
      '</div><div class="hint" id="cHint" style="margin-top:5px">' + PAY.cash.hint + '</div></div>' +
      '<div class="grid2">' + sellerField('cSeller') + fld('cDate', 'التاريخ', 'date', todayStr()) + '</div>' +
      '<div class="grid2" id="cDestWrap">' +
        sel('cDest', 'دخل المبلغ إلى', [{ v: '', t: 'درج المحل (كاش)' }].concat(payTargets().map(x => ({ v: x.id, t: x.name }))), '') +
        fld('cDisc', 'خصم $', 'number', 0, 'step="0.01"') + '</div>' +
      '<div id="cPayWrap" hidden>' + sel('cParty', 'الزبون', partyOptions(), '') + fld('cPaid', 'المدفوع الآن $', 'number', 0, 'step="0.01"') + '</div>' +
      fld('cNote', 'ملاحظة', 'text', ''),
      () => {
        const m = $('#cMethods [aria-pressed="true"]').dataset.m;
        return commitSale({ date: mv('cDate'), disc: n(mv('cDisc')), method: m,
          destId: m === 'debt' ? '' : mv('cDest'), seller: mv('cSeller').trim(),
          partyId: mv('cParty'), paid: m === 'debt' ? 0 : n(mv('cPaid')), note: mv('cNote') });
      }, 'تسجيل');
    const chips = $$('#cMethods .chip'), dest = $('#cDest'), sham = shamSite();
    const pick = k => {
      chips.forEach(c => c.setAttribute('aria-pressed', String(c.dataset.m === k)));
      $('#cHint').textContent = PAY[k].hint;
      $('#cPayWrap').hidden = (k === 'cash' || k === 'sham');
      $('#cDestWrap').querySelector('.f').hidden = (k === 'debt');
      const pp = $('#cPaid'); if (pp) pp.disabled = (k === 'debt');
      if (k === 'sham' && sham) dest.value = sham.id;
      if (k === 'cash') dest.value = '';
    };
    chips.forEach(c => c.onclick = () => pick(c.dataset.m));
    pick('cash'); break;
  }
  case 'retsale': {
    const sale = (book(S.month).sales || []).find(x => x.id === ds.id);
    if (!sale) { toast('الفاتورة ليست في شهر معروض', true); break; }
    const prev = (book(S.month).returns || []).filter(r => r.saleId === sale.id);
    const doneQty = {};
    prev.forEach(r => (r.lines || []).forEach(l => { doneQty[l.pid || l.name] = (doneQty[l.pid || l.name] || 0) + n(l.qty); }));
    const rows = (sale.lines || []).map((l, k) => {
      const key = l.pid || l.name;
      const left = n(l.qty) - (doneQty[key] || 0);
      return { k, l, left };
    }).filter(r => r.left > 0);
    if (!rows.length) { toast('كل أصناف هذه الفاتورة أُرجعت', true); break; }
    modal('مرتجع من فاتورة ' + money(sale.total) + ' $',
      '<p class="hint" style="margin:0">حدّد الكميات المرتجعة. تعود إلى الجرد، ويُخصم المبلغ من مبيعات الشهر.</p>' +
      '<div class="tw"><table><thead><tr><th>الصنف</th><th>المتاح</th><th>المرتجع</th><th>السعر</th></tr></thead><tbody>' +
      rows.map(r => `<tr><td>${esc(r.l.name)}</td><td class="n">${money0(r.left)}</td>
        <td><input class="priceinp" style="width:64px" type="number" min="0" step="1" data-ret="${r.k}" value="0"></td>
        <td class="n">${money(r.l.price)}</td></tr>`).join('') + '</tbody></table></div>' +
      sel('rtDest', 'طريقة الإرجاع', [
        { v: 'cash', t: 'نقداً من الدرج' },
        { v: 'credit', t: 'رصيد له عندنا (استبدال لاحقاً)' },
        { v: 'debt', t: 'خصم من دينه' }
      ].concat(payTargets().map(x => ({ v: 'site:' + x.id, t: 'إلى ' + x.name }))), 'cash') +
      '<div class="grid2">' + sellerField('rtSeller') + fld('rtDate', 'التاريخ', 'date', todayStr()) + '</div>' +
      fld('rtNote', 'سبب الإرجاع', 'text', ''),
      async () => {
        const lines = [];
        $$('#modal [data-ret]').forEach(inp => {
          const q = n(inp.value);
          if (q <= 0) return;
          const row = rows.find(r => String(r.k) === inp.dataset.ret);
          if (!row || q > row.left) return;
          lines.push({ pid: row.l.pid || null, sku: row.l.sku || '', name: row.l.name, qty: q, price: n(row.l.price), cost: n(row.l.cost) });
        });
        if (!lines.length) { toast('حدّد كمية للإرجاع', true); return; }
        const total = r2(lines.reduce((a, l) => a + l.price * l.qty, 0));
        const cost  = r2(lines.reduce((a, l) => a + l.cost  * l.qty, 0));
        const mode = mv('rtDest');
        /* إرجاع الكميات وأرصدة الخدمات */
        for (const l of lines) {
          if (!l.pid) continue;
          const pr = P(l.pid); if (!pr) continue;
          if (isStocked(pr)) pr.qty = r2(n(pr.qty) + l.qty);
          if (pr.siteId) { const st2 = SITE(pr.siteId); if (st2) { st2.balance = r2(n(st2.balance) + l.cost * l.qty); await saveSite(st2); } }
          await saveProduct(pr);
        }
        /* ردّ المبلغ */
        if ((mode === 'credit' || mode === 'debt') && !sale.partyId) {
          toast('هذه الفاتورة بلا زبون — اختر ردّاً نقدياً أو إلى حساب', true); return;
        }
        if (mode === 'cash') await receive('', -total);
        else if (mode.startsWith('site:')) await receive(mode.slice(5), -total);

        const rec = { id: uid('r'), date: mv('rtDate'), time: nowTime(), saleId: sale.id,
          seller: mv('rtSeller').trim() || who(), lines, total, cost,
          mode, partyId: sale.partyId || '', partyName: sale.partyName || '', note: mv('rtNote') };
        await Store.append('returns', rec.date, rec);
        await audit('مرتجع', money(total) + ' $ · ' + lines.length + ' صنف · ' + (sale.partyName || 'نقدي'), { ret: rec });
        await loadMonth(monthOf(rec.date), true); await saveSummary(monthOf(rec.date)); S.summaries = null;
        closeModal(); render(); toast('سُجّل مرتجع ' + money(total) + ' $');

  /* الأصناف */

      fld('pCost', 'التكلفة $', 'number', p ? n(p.cost) : '', 'step="0.01"') +

      async () => {
        if (!mv('pName').trim()) { toast('أدخل اسم القطعة', true); return; }
        let gName = mv('pGroup');
        if (gName === '__new') {

          if (!gName) { toast('أدخل اسم النوع الجديد', true); return; }
          if (!groupByName(gName)) {
            const custom = (S.settings.customGroups || []).slice();

        const obj = { id: p ? p.id : uid('p'), name: mv('pName').trim(), group: g.name,

        for (const pp of targets) {
          pp.price = priceFrom(pp.cost, margins[pp.group || ''] === undefined ? n(S.settings.defaultMargin) : n(margins[pp.group || '']), step);

        await audit('تسعير بالجملة', done + ' صنفاً · تقريب ' + step);

        const ex = $('#modal [data-ex="' + CSS.escape(i2.dataset.mg) + '"]');
        if (ex) { const c = n(ex.dataset.cost); ex.textContent = c ? money(c) + ' ← ' + money(priceFrom(c, n(i2.value), step)) : '—'; }
      });
      const targets = S.products.filter(pp => isStocked(pp) && n(pp.cost) > 0 && (scope === 'all' || !n(pp.price)));
      const gain = targets.reduce((a, pp) => a + (priceFrom(pp.cost, margins[pp.group || ''] ?? n(S.settings.defaultMargin), step) - n(pp.cost)) * n(pp.qty), 0);
      $('#bpPreview').querySelector('span:last-child').innerHTML =
        '<b>' + targets.length + ' صنفاً سيُسعَّر</b>الربح المتوقع من المخزون كله بعد التسعير: <span class="num">' + money(gain) + '</span> $';
    };
    $$('#modal [data-mg]').forEach(i2 => { i2.oninput = refresh; });
    $('#bpRound').onchange = refresh; $('#bpScope').onchange = refresh;
    refresh(); break;
  }
  case 'stocktake': {

    await Store.del('sites/' + ds.id); closeModal(); break;
  }
  case 'topup': {
    const s = SITE(ds.id);
    modal('شحن رصيد ' + s.name,
      '<div class="grid2">' + fld('tDate', 'التاريخ', 'date', todayStr()) + fld('tAmt', 'المبلغ $', 'number', '', 'step="0.01"') + '</div>' +
      fld('tNote', 'ملاحظة', 'text', ''),
      async () => {
        const a = n(mv('tAmt')); if (a <= 0) { toast('أدخل مبلغاً', true); return; }
        s.balance = r2(n(s.balance) + a); await saveSite(s); await addCash(-a);
        const rec = { id: uid('e'), date: mv('tDate'), time: nowTime(), kind: 'topup', who: s.name,
          seller: who(), siteId: s.id, amount: a, note: mv('tNote') };
        await Store.append('expenses', rec.date, rec);
        await loadMonth(monthOf(rec.date), true); await saveSummary(monthOf(rec.date));
        closeModal(); render(); toast('شُحن الرصيد');
      }, 'شحن'); break;
  }

  /* المصاريف */
  case 'newexp':
    if (!can('spend')) { toast('ليس لديك صلاحية تسجيل المصاريف', true); break; }
    modal('تسجيل استهلاك',
      '<div class="grid2">' + fld('xDate', 'التاريخ', 'date', todayStr()) + fld('xAmt', 'المبلغ $', 'number', '', 'step="0.01"') + '</div>' +
      sel('xCat', 'البند', allSpendCats().filter(c => !c.writeOff).map(c => ({ v: c.name, t: c.name })), ds.cat || 'كهرباء') +
      '<div class="grid2">' + sellerField('xSeller') +
        sel('xDest', 'خرج المبلغ من', [{ v: '', t: 'درج المحل (كاش)' }].concat(payTargets().map(x => ({ v: x.id, t: x.name }))), '') + '</div>' +
      fld('xNote', 'ملاحظة', 'text', ''),
      async () => {
        const a = n(mv('xAmt')); if (a <= 0) { toast('أدخل مبلغاً', true); return; }
        const rec = { id: uid('e'), date: mv('xDate'), time: nowTime(), kind: 'expense', cat: mv('xCat'), who: mv('xCat'),
          seller: mv('xSeller').trim() || who(), destId: mv('xDest'), destName: destName(mv('xDest')), amount: a, note: mv('xNote') };
        await receive(rec.destId, -a); await Store.append('expenses', rec.date, rec);
        await loadMonth(monthOf(rec.date), true); await saveSummary(monthOf(rec.date)); S.summaries = null;
        closeModal(); render(); toast('سُجّل المصروف');
      }, 'تسجيل'); break;

  case 'newdead': {
    if (!can('spend')) { toast('ليس لديك صلاحية تسجيل المصاريف', true); break; }
    const debtors = S.parties.filter(x => n(x.bal) > 0);
    if (!debtors.length) { toast('لا يوجد زبائن عليهم دين', true); break; }
    modal('شطب دين ميت',
      sel('dParty', 'الزبون', debtors.map(x => ({ v: x.id, t: x.name + ' — عليه ' + money(x.bal) + ' $' })), debtors[0].id) +
      '<div class="grid2">' + fld('dDate', 'التاريخ', 'date', todayStr()) +
        fld('dAmt', 'المبلغ المشطوب $', 'number', n(debtors[0].bal), 'step="0.01"') + '</div>' +
      fld('dNote', 'سبب الشطب', 'text', '') +
      '<p class="hint">الشطب يُنقص رصيد الزبون ولا يمسّ الصندوق، ويُسجَّل خسارة على ربح الشهر. لا يمكن التراجع إلا بحذف القيد.</p>',
      async () => {
        const party = PARTY(mv('dParty'));
        const a = n(mv('dAmt'));
        if (!party) { toast('اختر الزبون', true); return; }
        if (a <= 0) { toast('أدخل مبلغاً', true); return; }
        if (a > n(party.bal)) { toast('المبلغ أكبر من دين الزبون (' + money(party.bal) + ' $)', true); return; }
        await bumpParty(party.id, -a);
        const rec = { id: uid('e'), date: mv('dDate'), time: nowTime(), kind: 'expense', cat: 'ديون ميتة',
          who: party.name, seller: who(), partyId: party.id, partyName: party.name,
          noCash: true, amount: a, note: mv('dNote') };
        await Store.append('expenses', rec.date, rec);
        await loadMonth(monthOf(rec.date), true); await saveSummary(monthOf(rec.date)); S.summaries = null;
        await audit('شطب دين ميت', party.name + ' · ' + money(a) + ' $', { entry: rec });
        closeModal(); render(); toast('شُطب ' + money(a) + ' $ من دين ' + party.name);
      }, 'شطب');
    const dp = $('#dParty');
    if (dp) dp.onchange = () => { const x = PARTY(dp.value); if (x && $('#dAmt')) $('#dAmt').value = n(x.bal); };
    break;
  }
  case 'newspendcat':
    modal('بند استهلاك جديد', fld('scName', 'اسم البند', 'text', ''),
      async () => {
        const nm = mv('scName').trim();
        if (!nm) { toast('أدخل اسم البند', true); return; }
        if (!allSpendCats().some(c => c.name === nm))
          await saveSettings({ customSpend: (S.settings.customSpend || []).concat([nm]) });
        closeModal(); render(); toast('أُضيف البند');
      }); break;
  case 'expret': {
    const rows = (book(S.month).returns || []);
    download('المرتجعات-' + S.month + '.csv', csv([['التاريخ','الوقت','البائع','الأصناف','المبلغ $','التكلفة $','طريقة الإرجاع','الزبون','السبب']]
      .concat(rows.map(x => [x.date, x.time || '', x.seller || '', (x.lines || []).map(l => l.name + '×' + l.qty).join(' | '),
        n(x.total), n(x.cost), RET_MODE[x.mode] || x.mode, x.partyName || '', x.note || '']))));
    break;
  }
  case 'expspend': {
    const rows = spendRows(book(S.month));
    download('الاستهلاك-' + S.month + '.csv', csv([['التاريخ','الوقت','البند','المبلغ $','من سجّله','خرج من','الزبون','ملاحظة']]
      .concat(rows.map(x => [x.date, x.time || '', x.cat || '', n(x.amount), x.seller || '',
        x.noCash ? 'شطب دين (بلا نقد)' : (x.destId ? (x.destName || destName(x.destId)) : 'درج المحل'), x.partyName || '', x.note || '']))));
    break;
  }
  case 'newdraw': {
    const ps = S.settings.partners || [];
    if (!ps.length) { toast('أضف الشركاء من الإعدادات أولاً', true); go('settings'); break; }
    modal('مسحوبات شريك',
      sel('wWho', 'الشريك', ps.map((p, k) => ({ v: k, t: p.name })), 0) +
      '<div class="grid2">' + fld('wDate', 'التاريخ', 'date', todayStr()) + fld('wAmt', 'المبلغ $', 'number', '', 'step="0.01"') + '</div>' +
      fld('wNote', 'ملاحظة', 'text', '') +
      '<p class="hint">المسحوبات تُخصم من الصندوق وتُضاف إلى رصيد مسحوبات الشريك، وتظهر في حساب الموجودات.</p>',
      async () => {
        const a = n(mv('wAmt')); if (a <= 0) { toast('أدخل مبلغاً', true); return; }
        const k = +mv('wWho'); const list = (S.settings.partners || []).slice();
        list[k] = Object.assign({}, list[k], { drawn: r2(n(list[k].drawn) + a) });
        await saveSettings({ partners: list });
        await addCash(-a);
        const rec = { id: uid('e'), date: mv('wDate'), time: nowTime(), kind: 'withdrawal', who: list[k].name,
          seller: who(), amount: a, note: mv('wNote') };
        await Store.append('expenses', rec.date, rec);
        await loadMonth(monthOf(rec.date), true); await saveSummary(monthOf(rec.date)); S.summaries = null;
        closeModal(); render(); toast('سُجّلت المسحوبات');
      }, 'تسجيل'); break;
  }
  case 'delexp': {
    if (!confirm('حذف القيد؟')) break;
    const rec = (book(S.month).expenses || []).find(x => x.id === ds.id);
    if (rec) {
      if (rec.kind === 'topup' && rec.siteId) { const s = SITE(rec.siteId); if (s) { s.balance = r2(n(s.balance) - n(rec.amount)); await saveSite(s); } }
      if (rec.kind === 'withdrawal') {
        const list = (S.settings.partners || []).map(p => p.name === rec.who ? Object.assign({}, p, { drawn: r2(n(p.drawn) - n(rec.amount)) }) : p);
        await saveSettings({ partners: list });
      }
      if (rec.noCash) { if (rec.partyId) await bumpParty(rec.partyId, n(rec.amount)); }
      else if (rec.kind !== 'recon') await receive(rec.destId || '', n(rec.amount));
      await audit(rec.noCash ? 'حذف شطب دين' : 'حذف قيد مصروف',
        (rec.cat || rec.kind) + ' · ' + money(rec.amount) + ' $ · ' + rec.date, { entry: rec });
      await Store.mutate('expenses', S.month, ds.id, () => null);
      await loadMonth(S.month, true); await saveSummary(S.month); S.summaries = null; render();
    }
    break;
  }
  case 'recon':
    modal('تسوية المبلغ النقدي',
      fld('rAmt', 'المبلغ الفعلي في الدرج $', 'number', n(S.cash), 'step="0.01"') + fld('rNote', 'سبب الفرق', 'text', ''),
      async () => {
        const v = n(mv('rAmt')), diff = r2(v - n(S.cash));
        await setCash(v);
        await audit('تسوية صندوق', 'من ' + money(S.cash) + ' إلى ' + money(v) + ' $', { diff, note: mv('rNote') });
        if (diff !== 0) {
          const rec = { id: uid('e'), date: todayStr(), kind: 'recon', who: 'تسوية صندوق', amount: Math.abs(diff), note: (diff < 0 ? 'عجز ' : 'زيادة ') + money(Math.abs(diff)) + ' $ · ' + mv('rNote') };
          await Store.append('expenses', rec.date, rec);
          await loadMonth(monthOf(rec.date), true);
        }
        closeModal(); render(); toast('تمت التسوية');
      }, 'تسوية'); break;

  /* الإعدادات */
  case 'savesettings':
    await saveSettings({ shopName: mv('setName').trim() || 'دفتر المحل', rateTRY: n(mv('setRate')),
      capital: n(mv('setCap')), lowStock: n(mv('setLow')), lockMinutes: Math.max(0, n(mv('setLock'))),
      defaultLimit: Math.max(0, n(mv('setLimit'))), defaultMargin: Math.max(0, n(mv('setMargin'))) });
    if (n(mv('setCash')) !== n(S.cash)) await setCash(n(mv('setCash')));
    await audit('تعديل الإعدادات', 'رأس المال ' + money(mv('setCap')) + ' $ · سعر الصرف ' + mv('setRate'));
    toast('حُفظت الإعدادات'); break;
  case 'newpartner': case 'editpartner': {
    const list = (S.settings.partners || []).slice();
    const p = act === 'editpartner' ? list[i] : null;
    modal(p ? 'تعديل شريك' : 'شريك جديد',
      fld('nName', 'الاسم', 'text', p ? p.name : '') +
      '<div class="grid2">' + fld('nShare', 'الحصة %', 'number', p ? n(p.share) : 50, 'step="0.1"') +
      fld('nDrawn', 'مجموع مسحوباته $', 'number', p ? n(p.drawn) : 0, 'step="0.01"') + '</div>' +
      (p ? '<button class="btn danger" data-act="delpartner" data-i="' + i + '" type="button">حذف</button>' : ''),
      async () => {
        const obj = { name: mv('nName').trim(), share: n(mv('nShare')), drawn: n(mv('nDrawn')) };
        if (!obj.name) { toast('أدخل الاسم', true); return; }
        if (p) list[i] = obj; else list.push(obj);
        await saveSettings({ partners: list }); closeModal(); render();
      }); break;
  }
  case 'delpartner': { const l = (S.settings.partners || []).slice(); l.splice(i, 1); await saveSettings({ partners: l }); closeModal(); render(); break; }
  case 'newasset': case 'editasset': {
    const list = (S.settings.otherAssets || []).slice();
    const a = act === 'editasset' ? list[i] : null;
    modal(a ? 'تعديل بند' : 'بند موجودات',
      fld('aName', 'الاسم', 'text', a ? a.name : '') + fld('aVal', 'القيمة $', 'number', a ? n(a.value) : 0, 'step="0.01"') +
      (a ? '<button class="btn danger" data-act="delasset" data-i="' + i + '" type="button">حذف</button>' : ''),
      async () => {
        const obj = { name: mv('aName').trim(), value: n(mv('aVal')) };
        if (!obj.name) { toast('أدخل الاسم', true); return; }
        if (a) list[i] = obj; else list.push(obj);
        await saveSettings({ otherAssets: list }); closeModal(); render();
      }); break;
  }
  case 'delasset': { const l = (S.settings.otherAssets || []).slice(); l.splice(i, 1); await saveSettings({ otherAssets: l }); closeModal(); render(); break; }

  /* التصدير */
  case 'expstock':
    download('الجرد-' + todayStr() + '.csv', csv([['كود القطعة','نوع القطعة','الصنف','الماركة','رمز المصنّع','الفئة','الكمية','التكلفة','سعر البيع','قيمة التكلفة','IMEI','ملاحظة']]
      .concat(S.products.map(p => [p.sku, p.group, p.name, p.brand, p.code, catOf(p.cat).label, n(p.qty), n(p.cost), n(p.price), r2(n(p.qty) * n(p.cost)), p.imei, p.note]))));
    break;
  case 'expdebts':
    download('الديون-' + todayStr() + '.csv', csv([['الاسم','النوع','الرصيد $','الرصيد TL','الهاتف','ملاحظة']]
      .concat(S.parties.map(p => [p.name, p.kind === 'supplier' ? 'مورّد' : 'زبون', n(p.bal), r2(toTRY(p.bal)), p.phone, p.note]))));
    break;
  case 'expmonth': {
    const b = book(S.month);
    const rows = [['التاريخ','الوقت','البائع','طريقة الدفع','دخل المبلغ إلى','الأصناف','الإجمالي $','التكلفة $','الربح $','المدفوع $','الباقي ديناً $','الزبون','ملاحظة']];
    (b.sales || []).forEach(s => rows.push([s.date, s.time || (s.ts || '').slice(11, 16), s.seller || '', payLabel(s.method),
      s.destId ? (s.destName || destName(s.destId)) : 'كاش في الدرج',
      (s.lines || []).map(l => (l.sku ? l.sku + ' ' : '') + l.name + '×' + l.qty).join(' | '),
      n(s.total), n(s.cost), n(s.profit), n(s.paid), r2(n(s.total) - n(s.paid)), s.partyName, s.note]));
    const sm = summarize(b);
    rows.push([], ['المجموع', '', '', sm.revenue, sm.cost, sm.gross], ['المصاريف', '', '', sm.expenses], ['صافي الربح', '', '', sm.net]);
    download('مبيعات-' + S.month + '.csv', csv(rows)); break;
  }
  case 'backup':
    download('نسخة-دفتر-المحل-' + todayStr() + '.json', JSON.stringify({
      version: 1, at: new Date().toISOString(), settings: S.settings,
      products: S.products, parties: S.parties, sites: S.sites, ledger: S.ledger
    }, null, 1), 'application/json'); break;

  /* النوافذ */
  case 'modalok': if (modalSubmit) await modalSubmit(); break;
  case 'closemodal': closeScanner(); break;
  case 'scrim': if (ev && ev.target === el) closeModal(); break;
  }
}

document.addEventListener('change', e => {
  const a = e.target.closest('[data-act]');
  if (a && ['qtyset', 'price', 'cost'].includes(a.dataset.act)) handle(a.dataset.act, a.dataset, a, true);
});

boot();
</script>
