<title>دفتر المحل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ============ tokens ============ */
:root{
  --nav:#16233A; --nav-2:#1E3050; --nav-ink:#C6D2E6; --nav-dim:#7688A6; --nav-line:#25354F;
  --paper:#F5F7FB; --surface:#FFFFFF; --raised:#FFFFFF; --sunken:#F8FAFD;
  --ink:#16233A; --ink-2:#44546F; --muted:#7C8CA8;
  --line:#E4E9F2; --line-soft:#EDF1F7;
  --accent:#2563EB; --accent-ink:#FFFFFF; --accent-soft:#EAF1FE; --accent-line:#C3D8FC; --accent-deep:#1D4ED8;
  --good:#0E9F6E; --good-soft:#E3F7EF;
  --warn:#B45309; --warn-soft:#FDF2DF;
  --bad:#DC2626;  --bad-soft:#FDECEC;
  --violet:#7C3AED; --violet-soft:#F1EBFE;
  --chart-profit:#2563EB; --chart-cost:#C2831F; --grid:#E9EEF6;
  --sh-1:0 1px 2px rgba(22,35,58,.05);
  --sh-2:0 1px 3px rgba(22,35,58,.06), 0 8px 24px -14px rgba(22,35,58,.22);
  --sh-3:0 12px 40px -12px rgba(22,35,58,.30);
  --r:14px; --r-sm:9px; --r-xs:7px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --nav:#0E1626; --nav-2:#18263D; --nav-ink:#C6D2E6; --nav-dim:#6F819F; --nav-line:#1E2C43;
    --paper:#0B1220; --surface:#121C2D; --raised:#16223６; --sunken:#0F1829;
    --ink:#E7EDF6; --ink-2:#BCC9DC; --muted:#8397B4;
    --line:#233248; --line-soft:#1B2739;
    --accent:#4E86E8; --accent-ink:#06142B; --accent-soft:#16294A; --accent-line:#28457A; --accent-deep:#6C9CF0;
    --good:#34B98A; --good-soft:#0F2E24;
    --warn:#D69A46; --warn-soft:#2E2413;
    --bad:#E4706A;  --bad-soft:#331A1A;
    --violet:#A78BFA; --violet-soft:#241C3D;
    --chart-profit:#4E86E8; --chart-cost:#B8842A; --grid:#1E2C40;
    --sh-1:0 1px 2px rgba(0,0,0,.4);
    --sh-2:0 1px 3px rgba(0,0,0,.45), 0 10px 26px -16px rgba(0,0,0,.8);
    --sh-3:0 14px 44px -14px rgba(0,0,0,.85);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --nav:#0E1626; --nav-2:#18263D; --nav-ink:#C6D2E6; --nav-dim:#6F819F; --nav-line:#1E2C43;
  --paper:#0B1220; --surface:#121C2D; --raised:#162236; --sunken:#0F1829;
  --ink:#E7EDF6; --ink-2:#BCC9DC; --muted:#8397B4;
  --line:#233248; --line-soft:#1B2739;
  --accent:#4E86E8; --accent-ink:#06142B; --accent-soft:#16294A; --accent-line:#28457A; --accent-deep:#6C9CF0;
  --good:#34B98A; --good-soft:#0F2E24;
  --warn:#D69A46; --warn-soft:#2E2413;
  --bad:#E4706A;  --bad-soft:#331A1A;
  --violet:#A78BFA; --violet-soft:#241C3D;
  --chart-profit:#4E86E8; --chart-cost:#B8842A; --grid:#1E2C40;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 1px 3px rgba(0,0,0,.45), 0 10px 26px -16px rgba(0,0,0,.8);
  --sh-3:0 14px 44px -14px rgba(0,0,0,.85);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink); direction:rtl;
  font-family:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  font-size:14.5px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"Tajawal","IBM Plex Sans Arabic",sans-serif;font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.num,.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}

/* ============ shell ============ */
.app{display:grid;grid-template-columns:1fr;min-height:100vh}
.rail{display:none}
.main{min-width:0;padding:0 14px 92px;width:100%}

/* breadcrumb bar */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line);
  margin:0 -14px 16px;padding:9px 14px;display:flex;align-items:center;gap:10px;min-height:52px;
}
.crumbs{display:none;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);min-width:0;flex:1}
@media(min-width:960px){.crumbs{display:flex}}
.crumbs b{color:var(--ink);font-weight:600;font-family:"Tajawal",sans-serif}
.crumbs .sep{opacity:.5}
.stamp{font-size:11.5px;color:var(--muted);display:none;align-items:center;gap:5px;white-space:nowrap}
@media(min-width:760px){.stamp{display:flex}}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none;border:1px solid var(--accent-line);cursor:pointer;font-family:"Tajawal",sans-serif}
.avatar:hover{background:var(--accent);color:var(--accent-ink)}
.avatar.none{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}

/* mobile brand inside topbar */
.mbrand{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
@media(min-width:960px){.mbrand{display:none}}
.mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;
  display:grid;place-items:center;flex:none;box-shadow:var(--sh-1)}
.mark svg{width:19px;height:19px;stroke-width:1.9}
.mbrand b{font-family:"Tajawal",sans-serif;font-weight:700;font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.sellerbtn{display:block;background:none;border:0;padding:0;margin:0;cursor:pointer;color:var(--accent);
  font:inherit;font-size:11.5px;font-weight:600;line-height:1.25;text-align:start;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:"IBM Plex Sans Arabic",sans-serif}
.sellerbtn:hover{text-decoration:underline}
.sellerbtn.none{color:var(--warn)}

.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);width:36px;height:36px;
  display:grid;place-items:center;cursor:pointer;color:var(--ink-2);flex:none}
.iconbtn:hover{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.iconbtn svg{width:17px;height:17px;stroke-width:1.8}

/* bottom tabs (phone) */
.tabbar{
  position:fixed;inset-inline:0;bottom:0;z-index:50;background:var(--surface);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding:5px 5px calc(5px + env(safe-area-inset-bottom));box-shadow:0 -2px 14px rgba(22,35,58,.06);
}
.tabbar button{background:none;border:0;cursor:pointer;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;font-size:10.5px;font-weight:600}
.tabbar button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.tabbar svg{width:20px;height:20px;stroke-width:1.8}

/* ============ sidebar (desktop) ============ */
@media (min-width:960px){
  .app{grid-template-columns:250px 1fr}
  .tabbar{display:none}
  .rail{
    display:flex;flex-direction:column;background:var(--nav);color:var(--nav-ink);
    position:sticky;top:0;height:100vh;padding:18px 14px 14px;overflow-y:auto;
  }
  .main{padding:0 30px 44px;max-width:1440px}
  .topbar{margin-inline:-30px;padding-inline:30px}
}
.rbrand{display:flex;align-items:center;gap:11px;padding:2px 6px 20px;min-width:0}
.rbrand .mark{width:40px;height:40px;border-radius:11px}
.rbrand b{font-family:"Tajawal",sans-serif;font-weight:700;font-size:19px;color:#fff;display:block;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbrand small{display:block;font-size:11px;color:var(--nav-dim);line-height:1.3}
.navsec{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--nav-dim);
  font-weight:700;padding:0 8px 9px}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail nav button{display:flex;align-items:center;gap:11px;background:none;border:0;cursor:pointer;
  padding:10px 11px;border-radius:10px;color:var(--nav-ink);font-size:14px;font-weight:500;text-align:start;width:100%}
.rail nav button:hover{background:var(--nav-2);color:#fff}
.rail nav button[aria-current="page"]{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 4px 14px -4px rgba(37,99,235,.6)}
.rail nav svg{width:18px;height:18px;stroke-width:1.8;flex:none;opacity:.95}
.rail nav .plus{margin-inline-start:auto;font-size:17px;line-height:1;opacity:.6}
.railfoot{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:7px}
.railcard{background:var(--nav-2);border:1px solid var(--nav-line);border-radius:11px;padding:10px 12px;
  display:flex;align-items:center;gap:9px;font-size:12px;color:var(--nav-ink)}
.railcard svg{width:15px;height:15px;stroke-width:1.8;flex:none;color:var(--nav-dim)}
.railbtn{background:none;border:0;color:var(--nav-dim);cursor:pointer;font:inherit;font-size:12.5px;
  display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:9px;text-align:start}
.railbtn:hover{background:var(--nav-2);color:#fff}
.railbtn svg{width:15px;height:15px;stroke-width:1.8}

/* ============ page header ============ */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.phead .date{font-size:11.5px;color:var(--muted);font-weight:500;margin-bottom:2px}
.phead h1{font-size:25px;line-height:1.25}
@media(max-width:520px){.phead h1{font-size:21px}}
.phead .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ============ primitives ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1)}
.pad{padding:16px 18px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.sec-h{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.sec-h h2{font-size:16.5px}
.eyebrow{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;
  font-family:"IBM Plex Sans Arabic",sans-serif}
.hint{color:var(--muted);font-size:12.5px;line-height:1.65}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:680px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;
  box-shadow:var(--sh-1);display:flex;flex-direction:column;gap:2px}
.kpi .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.kpi .k{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:var(--accent-soft);color:var(--accent)}
.kpi-ic svg{width:16px;height:16px;stroke-width:1.9}
.kpi.pos .kpi-ic{background:var(--good-soft);color:var(--good)}
.kpi.neg .kpi-ic{background:var(--bad-soft);color:var(--bad)}
.kpi.vio .kpi-ic{background:var(--violet-soft);color:var(--violet)}
.kpi.amb .kpi-ic{background:var(--warn-soft);color:var(--warn)}
.kpi .v{font-family:"Tajawal",sans-serif;font-weight:700;font-size:23px;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:11.5px;color:var(--muted)}
.kpi.pos .v{color:var(--good)} .kpi.neg .v{color:var(--bad)} .kpi.acc .v{color:var(--accent)}

/* buttons */
.btn{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:var(--r-sm);
  padding:9px 14px;cursor:pointer;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;
  white-space:nowrap;box-shadow:var(--sh-1);transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent)}
.btn svg{width:16px;height:16px;stroke-width:1.9}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 14px -5px rgba(37,99,235,.65)}
.btn.primary:hover{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding:6px 9px;box-shadow:none}
.btn.ghost:hover{color:var(--accent);background:var(--accent-soft)}
.btn.danger{color:var(--bad);border-color:var(--line)}
.btn.danger:hover{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.big{padding:13px 16px;font-size:15px;justify-content:center;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* fields */
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:11.5px;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{
  background:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;width:100%;font-size:14px}
.f input::placeholder{color:var(--muted);opacity:.75}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.f input[type=number]{direction:ltr;text-align:start;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.grid3{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(min-width:640px){.grid3{grid-template-columns:repeat(3,1fr)}}

/* chips & pills */
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;scrollbar-width:thin}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12.5px;
  cursor:pointer;white-space:nowrap;color:var(--ink-2);font-weight:600}
.chip:hover{border-color:var(--accent-line);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:7px;padding:2px 8px;font-size:11px;font-weight:600;line-height:1.75}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.low{background:var(--warn-soft);color:var(--warn)}
.pill.out{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--line-soft);color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.code{background:var(--line-soft);color:var(--ink-2);font-family:"IBM Plex Mono",monospace;direction:ltr;letter-spacing:.02em}

/* rows */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line-soft);min-width:0}
.item:last-child{border-bottom:0}
.item .t{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{font-size:11.5px;color:var(--muted);display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:1px}
.item .amt{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-weight:600;
  text-align:end;direction:ltr;flex:none;font-size:14px}
.item.click{cursor:pointer}
.item.click:hover{background:var(--sunken)}
.stripe{width:3px;height:30px;border-radius:3px;flex:none;background:var(--line)}
.stripe.good{background:var(--good)} .stripe.warn{background:var(--warn)} .stripe.bad{background:var(--bad)} .stripe.acc{background:var(--accent)}
.rowic{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent)}
.rowic svg{width:17px;height:17px;stroke-width:1.8}

/* empty state */
.empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:13.5px}
.empty .eic{width:46px;height:46px;border-radius:13px;background:var(--sunken);border:1px solid var(--line);
  color:var(--muted);display:grid;place-items:center;margin:0 auto 11px}
.empty .eic svg{width:22px;height:22px;stroke-width:1.6}
.empty b{display:block;color:var(--ink-2);font-size:14px;font-weight:600;margin-bottom:3px;font-family:"Tajawal",sans-serif}

/* banner */
.banner{display:flex;gap:11px;align-items:center;padding:13px 16px;border-radius:var(--r);font-size:13px;
  border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--ink-2)}
.banner .bic{width:32px;height:32px;border-radius:9px;background:var(--surface);color:var(--accent);
  display:grid;place-items:center;flex:none;border:1px solid var(--accent-line)}
.banner .bic svg{width:17px;height:17px;stroke-width:1.8}
.banner b{display:block;color:var(--ink);font-family:"Tajawal",sans-serif;font-size:13.5px}
.banner.warn{border-color:var(--warn);background:var(--warn-soft)}
.banner.warn .bic{color:var(--warn);border-color:var(--warn)}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:10px 16px;text-align:start;border-bottom:1px solid var(--line-soft);white-space:nowrap}
th{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.03em;background:var(--sunken);
  position:sticky;top:0;border-bottom:1px solid var(--line)}
td.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
tbody tr:hover{background:var(--sunken)}
tfoot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0;background:var(--sunken)}

/* wallets */
.wallets{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px}
.wallet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;
  font:inherit;color:inherit;text-align:start;width:100%;
  box-shadow:var(--sh-1);cursor:pointer;border-top:3px solid var(--accent);display:flex;flex-direction:column;gap:3px}
.wallet:hover{box-shadow:var(--sh-2);border-color:var(--accent-line)}
.wallet.buy{border-top-color:var(--violet)}
.wallet .wic{width:32px;height:32px;border-radius:9px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;margin-bottom:6px}
.wallet.buy .wic{background:var(--violet-soft);color:var(--violet)}
.wallet .wic svg{width:17px;height:17px;stroke-width:1.8}
.wallet .wn{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wallet .wb{font-family:"Tajawal",sans-serif;font-weight:700;font-size:21px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wallet .wf{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--muted);
  border-top:1px solid var(--line-soft);margin-top:9px;padding-top:9px}

/* بنود الاستهلاك: صفوف ممتلئة بلا فراغ */
.spendgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
@media(min-width:620px){.spendgrid{grid-template-columns:repeat(4,1fr)}}
.pcard.add-tile{border-style:dashed;justify-content:center;align-items:center;text-align:center}
.pcard.add-tile .pn{color:var(--accent)}

/* product grid (POS) */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:11px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px;text-align:start;
  cursor:pointer;display:flex;flex-direction:column;gap:3px;box-shadow:var(--sh-1);font:inherit;color:inherit;min-width:0}
.pcard:hover{border-color:var(--accent);box-shadow:var(--sh-2)}

<script>
"use strict";
/* ============================================================
   دفتر المحل — نقطة بيع وجرد ومحاسبة لمحل موبايل
   البيانات تُحفظ في قاعدة بيانات الصفحة (تتزامن بين اللابتوب والهاتف)
   ============================================================ */

/* ---------- 1. أدوات ---------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const nowTime = () => { const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
const todayStr = () => { const d = new Date(); return [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-'); };
const monthOf = d => String(d || todayStr()).slice(0, 7);
const n = v => { const x = parseFloat(String(v ?? '').replace(/[^\d.\-]/g, '')); return Number.isFinite(x) ? x : 0; };
const r2 = x => Math.round((Number(x) + Number.EPSILON) * 100) / 100;
const money = x => r2(x).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money0 = x => Math.round(Number(x) || 0).toLocaleString('en-US');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const AR_MONTHS = ['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
const monthLabel = m => { const [y, mo] = String(m).split('-'); return AR_MONTHS[(+mo || 1) - 1] + ' ' + y; };
const dayNum = d => +String(d).slice(8, 10);

function toast(msg, bad) {
  const t = $('#toast');
  t.innerHTML = '<div class="' + (bad ? 'bad' : '') + '">' + esc(msg) + '</div>';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.innerHTML = ''; }, bad ? 5200 : 2600);
}

/* ---------- 2. طبقة التخزين ----------
   تستخدم قاعدة بيانات الصفحة عند توفرها، وتعود إلى ذاكرة المتصفح
   حتى تبقى الصفحة صالحة للاستخدام قبل جاهزية القاعدة أو خارجها. */
const Store = (() => {
  let db = null, live = false;
  const subs = new Map();                       // path/coll -> Set(cb)
  const LS = 'daftar:';

  /* مسح مستندات المتصفح: كل مدخل يُقرأ على حدة، فمدخل تالف واحد
     لا يُسقط بقية السجلات (كان يفعل ذلك سابقاً ويخفي أصنافاً وحسابات). */
  const lsAll = () => {
    const out = {};
    let keys = [];
    try { for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i)); }
    catch (e) { return out; }                       /* التخزين المحلي محجوب */
    for (const k of keys) {
      if (!k || !k.startsWith(LS)) continue;
      const path = k.slice(LS.length);
      if (!path.includes('/')) continue;            /* ليس مسار مستند */
      try { out[path] = JSON.parse(localStorage.getItem(k)); } catch (e) { /* مدخل تالف — يُتجاوز */ }
    }
    return out;
  };
  const lsGet = p => { try { const v = localStorage.getItem(LS + p); return v ? JSON.parse(v) : null; } catch (e) { return null; } };
  const lsSet = (p, o) => { try { localStorage.setItem(LS + p, JSON.stringify(o)); } catch (e) {} };
  const lsDel = p => { try { localStorage.removeItem(LS + p); } catch (e) {} };
  const fire = key => { const s = subs.get(key); if (s) s.forEach(cb => { try { cb(); } catch (e) { console.error(e); } }); };
  const collOf = p => p.split('/').slice(0, -1).join('/');

  /* ---------- طابور الإرسال ----------
     إن سقط الاتصال أثناء البيع تُحفظ الحركة محلياً وتُصفّ هنا، ثم تُرسَل
     إلى الخادم فور عودة الشبكة. القيود تُعاد كـ«إضافة» لا ككتابة مستند
     كامل، حتى لا تمحو ما سجّله جهاز آخر في الأثناء. */
  const OBK = 'daftar.outbox';
  let outbox = [];
  let flushing = false;
  const obLoad = () => { try { outbox = JSON.parse(localStorage.getItem(OBK) || '[]'); } catch (e) { outbox = []; } };
  const obSave = () => { try { localStorage.setItem(OBK, JSON.stringify(outbox.slice(-500))); } catch (e) {} };
  const obPush = item => { outbox.push(Object.assign({ at: new Date().toISOString() }, item)); obSave(); onQueue(); };
  const denied = e => e && (e.code === 'invalid_argument' || e.code === 'revoked' ||
                            e.code === 'not_granted' || e.code === 'quota_exceeded');
  let onQueue = () => {};
  obLoad();

  async function flush() {
    if (flushing || !db || !outbox.length) return;
    flushing = true;
    try {
      while (outbox.length) {
        const it = outbox[0];
        try {
          if (it.op === 'set') await db.doc(it.path).set(it.obj);
          else if (it.op === 'del') await db.doc(it.path).delete();
          else if (it.op === 'append') { if (!(await appendRemote(it.coll, it.month, it.entry))) throw new Error('append'); }
        } catch (e) {
          if (denied(e)) { outbox.shift(); obSave(); continue; }   /* مرفوض نهائياً — يُسقَط */
          break;                                                    /* الشبكة — نعيد المحاولة لاحقاً */
        }
        outbox.shift(); obSave();
      }
    } finally { flushing = false; onQueue(); }
  }

  /* إضافة قيد على الخادم مباشرة، بلا تكرار إن كان مسجّلاً */
  async function appendRemote(coll, m, entry) {
    for (let part = 1; part <= 40; part++) {
      const id = part === 1 ? m : m + '.p' + part;
      const snap = await db.doc(coll + '/' + id).get();
      const body = snap.exists ? snap.data() : null;
      if (body && (body.items || []).some(x => x.id === entry.id)) return true;   /* مسجّل سلفاً */
      if (!body) { await db.doc(coll + '/' + id).set({ month: m, items: [entry] }); return true; }
      if (JSON.stringify(body).length > 200000 && (body.items || []).length) continue;
      body.items = (body.items || []).concat([entry]);
      await db.doc(coll + '/' + id).set(body);
      return true;
    }
    return false;
  }

  addEventListener('online', () => flush());
  setInterval(() => flush(), 15000);

  async function init() {
    try { db = await window.claude?.use?.('db'); } catch (e) { db = null; }
    live = !!db;
    return live;
  }

  /* قراءة مستند واحد */
  async function get(path) {
    if (!db) return lsGet(path);
    try { const s = await db.doc(path).get(); return s.exists ? s.data() : null; }
    catch (e) { return lsGet(path); }
  }

  /* كتابة مستند كامل */
  async function set(path, obj, noQueue) {
    lsSet(path, obj);
    fire(path); fire(collOf(path));
    if (!db) return true;
    try { await db.doc(path).set(obj); return true; }
    catch (e) {
      if (denied(e)) { toast('صلاحيتك لا تسمح بتعديل هذا — راجع صاحب المحل', true); return false; }
      if (!noQueue) obPush({ op: 'set', path, obj });
      return false;
    }
  }

  async function del(path) {
    lsDel(path); fire(path); fire(collOf(path));
    if (!db) return true;
    try { await db.doc(path).delete(); return true; }
    catch (e) { if (!denied(e)) obPush({ op: 'del', path }); return false; }
  }

  /* قراءة مجموعة كاملة */
  async function list(coll) {
    if (!db) {
      const all = lsAll(), out = [];
      for (const k in all) {
        const parts = k.split('/');
        if (parts.slice(0, -1).join('/') === coll) out.push(Object.assign({ id: parts[parts.length - 1] }, all[k]));
      }
      return out;
    }
    try {
      const s = await db.collection(coll).get();
      return s.docs.map(d => Object.assign({ id: d.id }, d.data()));
    } catch (e) { return []; }
  }

  /* اشتراك حيّ في مجموعة */
  function watch(coll, cb, where) {
    if (db) {
      try {
        let q = db.collection(coll);
        if (where) q = q.where(where[0], where[1], where[2]);
        return q.onSnapshot(
          s => cb(s.docs.map(d => Object.assign({ id: d.id }, d.data()))),
          () => { list(coll).then(cb); }
        );
      } catch (e) { /* يسقط للأسفل */ }
    }
    const f = () => list(coll).then(rows => cb(where ? rows.filter(r => r[where[0]] === where[2]) : rows));
    if (!subs.has(coll)) subs.set(coll, new Set());
    subs.get(coll).add(f); f();
    return () => subs.get(coll).delete(f);
  }

  function watchDoc(path, cb) {
    if (db) {
      try { return db.doc(path).onSnapshot(s => cb(s.exists ? s.data() : null), () => {}); }
      catch (e) { /* يسقط للأسفل */ }
    }
    const f = () => cb(lsGet(path));
    if (!subs.has(path)) subs.set(path, new Set());
    subs.get(path).add(f); f();
    return () => subs.get(path).delete(f);
  }

  /* حجز قصير على مستند — لمنع تنفيذ عملية مرة واحدة من جهازين معاً */
  async function lease(path, holder, ttlMs) {
    if (!db) return true;
    try { const r = await db.doc(path).acquire({ holder, ttlMs }); return !!r.acquired; }
    catch (e) { return true; }
  }

  /* إضافة قيد إلى دفتر الشهر، مع تقسيم تلقائي إذا امتلأ المستند */
  async function append(coll, dateStr, entry) {
    const m = monthOf(dateStr);
    /* لا يُضاف قيد مسجّل سلفاً — يجعل إعادة الإرسال آمنة */
    for (let part = 1; part <= 40; part++) {
      const body = await get(coll + '/' + (part === 1 ? m : m + '.p' + part));
      if (!body) break;
      if ((body.items || []).some(x => x.id === entry.id)) return part === 1 ? m : m + '.p' + part;
    }
    for (let part = 1; part <= 40; part++) {
      const id = part === 1 ? m : m + '.p' + part;
      const path = coll + '/' + id;
      const body = (await get(path)) || { month: m, items: [] };
      body.month = m;
      body.items = Array.isArray(body.items) ? body.items : [];
      if (JSON.stringify(body).length > 200000 && body.items.length) continue;
      body.items = body.items.concat([entry]);
      const ok = await set(path, body, true);
      if (!ok && db) { obPush({ op: 'append', coll, month: m, entry }); return id; }
      /* تحقّق: إن ضاع القيد بسبب كتابة متزامنة، أعده */
      if (db) {
        const check = await get(path);
        if (!check || !(check.items || []).some(x => x.id === entry.id)) {
          const again = (await get(path)) || { month: m, items: [] };
          again.items = (again.items || []).concat([entry]);
          await set(path, again);
        }
      }
      return id;
    }
    throw new Error('month-full');
  }

  /* قراءة كل قيود شهر (بكل أجزائه) */
  async function readMonth(coll, m) {
    const out = [];
    for (let part = 1; part <= 40; part++) {
      const id = part === 1 ? m : m + '.p' + part;
      const body = await get(coll + '/' + id);
      if (!body) break;
      out.push(...(body.items || []));
    }
    return out;
  }

  /* تعديل أو حذف قيد داخل دفتر الشهر */
  async function mutate(coll, m, entryId, fn) {
    for (let part = 1; part <= 40; part++) {
      const id = part === 1 ? m : m + '.p' + part;
      const path = coll + '/' + id;
      const body = await get(path);
      if (!body) return false;
      const i = (body.items || []).findIndex(x => x.id === entryId);
      if (i >= 0) {
        const next = fn(body.items[i]);
        if (next === null) body.items.splice(i, 1); else body.items[i] = next;
        await set(path, body);
        return true;
      }
    }
    return false;
  }

  return { init, get, set, del, list, watch, watchDoc, lease, append, readMonth, mutate, flush,
    onQueueChange(f) { onQueue = f; },
    get pending() { return outbox.length; },
    get isLive() { return live; } };
})();

/* ---------- 3. الحالة ---------- */
const DEFAULT_SETTINGS = {
  shopName: 'دفتر المحل',
  rateTRY: 48,
  capital: 0,
  cash: 0,
  lowStock: 2,
  lockMinutes: 0,
  defaultLimit: 0,
  partners: [],
  otherAssets: [],
  customGroups: [],
  staff: [],
  customSpend: [],

    if (byCat) return byCat;
  }
  const hay = ((p.name || '') + ' ' + (p.brand || '')).toLowerCase();

function priceFrom(cost, margin, step) {
  const raw = n(cost) * (1 + n(margin) / 100);
  const st = step === undefined ? n(S.settings.roundTo) : n(step);
  if (!st || raw <= 0) return r2(raw);
  return r2(Math.ceil(raw / st) * st);
}

/* الكود التالي ضمن نوع معيّن: SPK-001 ، SPK-002 … */
function nextSku(prefix, extra) {
  let max = 0;
  const scan = sku => { const m = /^([A-Za-z0-9]+)-(\d+)$/.exec(sku || ''); if (m && m[1] === prefix) max = Math.max(max, +m[2]); };

  (extra || []).forEach(scan);
  return prefix + '-' + String(max + 1).padStart(3, '0');
}

const CLIENT_ID = 'c' + Math.random().toString(36).slice(2, 9);
let codesDone = false;
async function ensureCodes() {
  if (codesDone || !S.products.length) return;
  const need = S.products.filter(x => !x.sku || !x.group);
  if (!need.length) { codesDone = true; return; }
  codesDone = true;
  if (!(await Store.lease('meta/codelock', CLIENT_ID, 180000))) return;
  const counters = {};
  S.products.forEach(x => {
    const m = /^([A-Za-z0-9]+)-(\d+)$/.exec(x.sku || '');
    if (m) counters[m[1]] = Math.max(counters[m[1]] || 0, +m[2]);
  });
  let done = 0;
  for (const x of need) {
    const g = groupByName(x.group) || inferGroup(x);
    x.group = g.name;
    if (!x.sku) {
      counters[g.prefix] = (counters[g.prefix] || 0) + 1;
      x.sku = g.prefix + '-' + String(counters[g.prefix]).padStart(3, '0');
    }
    await saveProduct(x);
    if (++done % 8 === 0) await new Promise(r => setTimeout(r, 180));
  }
  toast('تم ترقيم ' + done + ' قطعة وتصنيفها حسب النوع');
  render();
}

async function hashPin(pin, salt) {
  const data = new TextEncoder().encode(String(salt) + '|' + String(pin));
  try {
    if (crypto && crypto.subtle && crypto.subtle.digest) {
      const buf = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) { /* يسقط للبديل */ }
  let h = 5381;
  for (const b of data) h = ((h * 33) ^ b) >>> 0;
  return 'x' + h.toString(16);
}

}

/* ملخّص الشهر — يُحفظ ليبقى تقرير السنة سريعاً */
function summarize(b) {
  const sales = b.sales || [], exps = b.expenses || [], pays = b.payments || [], rets = b.returns || [];
  const retTotal = rets.reduce((s, x) => s + n(x.total), 0);
  const retCost  = rets.reduce((s, x) => s + n(x.cost), 0);
  const revenue = sales.reduce((s, x) => s + n(x.total), 0) - retTotal;
  const cost    = sales.reduce((s, x) => s + n(x.cost), 0) - retCost;
  const gross   = revenue - cost;
  const spend   = exps.filter(x => x.kind === 'expense').reduce((s, x) => s + n(x.amount), 0);
  const draws   = exps.filter(x => x.kind === 'withdrawal').reduce((s, x) => s + n(x.amount), 0);
  const topups  = exps.filter(x => x.kind === 'topup').reduce((s, x) => s + n(x.amount), 0);
  return {
    revenue: r2(revenue), cost: r2(cost), gross: r2(gross),
    expenses: r2(spend), withdrawals: r2(draws), topups: r2(topups),
    net: r2(gross - spend), count: sales.length,
    returns: r2(retTotal), returnsCount: rets.length,
    collected: r2(pays.filter(p => p.dir === 'in').reduce((s, x) => s + n(x.amount), 0))
  };
}

const NAV = [
  { id: 'pos',      label: 'بيع جديد',            short: 'بيع',      icon: 'pos',   plus: true, perm: 'sell' },
  { id: 'stock',    label: 'المخزون والجرد',       short: 'الجرد',    icon: 'stock', perm: 'stock' },
  { id: 'debts',    label: 'الديون والمستحقات',    short: 'الديون',   icon: 'debts', perm: 'debts' },
  { id: 'spend',    label: 'الاستهلاك والمصاريف',  short: 'الاستهلاك',icon: 'spend', perm: 'spend' },
  { id: 'cash',     label: 'الصناديق والمحافظ',    short: 'الصندوق',  icon: 'cash',  perm: 'cash'  },
  { id: 'report',   label: 'الأرباح والتقارير',    short: 'التقارير', icon: 'rep',   perm: 'reports' },
  { id: 'guard',    label: 'الحماية والنسخ',        short: 'الحماية',  icon: 'shield', perm: 'settings' },
  { id: 'settings', label: 'الإعدادات',            short: 'إعدادات',  icon: 'set',   perm: 'settings' }
];
const navOf = v => NAV.find(x => x.id === v) || NAV[0];
const myNav = () => NAV.filter(t => can(t.perm));

function renderNav() {
  const mine = myNav();
  $('#tabbar').innerHTML = mine.slice(0, 5).map(t =>
    '<button type="button" data-nav="' + t.id + '"' + (S.view === t.id ? ' aria-current="page"' : '') + '>' +
    svg(t.icon) + '<span>' + t.short + '</span></button>').join('');
  $('#railnav').innerHTML = mine.map(t =>
    '<button type="button" data-nav="' + t.id + '"' + (S.view === t.id ? ' aria-current="page"' : '') + '>' +
    svg(t.icon) + '<span>' + t.label + '</span>' + (t.plus ? '<span class="plus">+</span>' : '') + '</button>').join('');
  $('#rmark').innerHTML = svg('book');
  $$('.mbrand .mark').forEach(el => el.innerHTML = svg('book'));
  $('#btnTheme').innerHTML = svg('moon');
  $('#railTheme').innerHTML = svg('moon') + '<span>تبديل الوضع الليلي</span>';
  const so = $('#railOut');
  so.hidden = !S.users.length;
  so.innerHTML = svg('logout') + '<span>تسجيل الخروج</span>';
  $('#railStatus').innerHTML = svg('shield') + '<span id="railStatusTxt">مساحة خاصة بصاحب المحل</span>';
}
function go(v) {
  const t = NAV.find(x => x.id === v);
  if (t && !can(t.perm)) { toast('ليس لديك صلاحية لهذا القسم', true); return; }
  S.view = v; renderNav(); render(); window.scrollTo({ top: 0 });
}

document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { go(nav.dataset.nav); return; }
  const act = e.target.closest('[data-act]');
  if (act) { handle(act.dataset.act, act.dataset, act, false, e); }
});
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  prefSet('theme', dark ? 'light' : 'dark');
}
$('#btnTheme').onclick = toggleTheme;
$('#railTheme').onclick = toggleTheme;
try { const t = prefGet('theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}

/* ترويسة الصفحة: التاريخ، العنوان، وأزرار القسم */
const AR_DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function longDate() {
  const d = new Date();
  return d.getDate() + ' ' + AR_MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}
function pageHead(title, acts) {
  return '<div class="phead"><div><div class="date">' + esc(longDate()) + '</div><h1>' + esc(title) + '</h1></div>' +
    '<div class="acts">' + (acts || '') + '</div></div>';
}
function headActions(view) {
  const refresh = '<button class="iconbtn" data-act="reload" type="button" aria-label="تحديث">' + svg('refresh') + '</button>';
  if (view === 'report')
    return '<select id="monthSel" aria-label="اختر الشهر" class="btn" style="font-weight:600;padding-inline-end:10px">' +
      monthOptions().map(m => `<option value="${m}"${m === S.month ? ' selected' : ''}>${monthLabel(m)}</option>`).join('') +
      '</select><button class="btn" data-act="expmonth" type="button">تصدير الشهر</button>' + refresh;
  const sell = view === 'pos' ? '' : '<button class="btn primary" data-nav="pos" type="button">+ بيع جديد</button>';
  return sell + refresh;
}
/* ---------- 7. الراسم ---------- */
function render() {
  if (renderGate()) return;
  const el = $('#view');
  const fn = ({ pos: viewPOS, stock: viewStock, debts: viewDebts, spend: viewSpend, cash: viewCash,
                report: viewReport, guard: viewGuard, settings: viewSettings })[S.view] || viewPOS;
  const y = window.scrollY;
  if (!can(navOf(S.view).perm)) { const first = myNav()[0]; if (first && first.id !== S.view) { S.view = first.id; renderNav(); } }
  const meta = navOf(S.view);
  $('#crumbs').innerHTML = '<b>' + esc(S.settings.shopName || 'دفتر المحل') + '</b><span class="sep">›</span><span>' + esc(meta.label) + '</span>';
  $('#stamp').innerHTML = svg('clock', 13) + '<span>آخر تحديث ' + nowTime() + '</span>';
  el.innerHTML = pageHead(meta.label, headActions(S.view)) + fn();
  if (typeof fn.after === 'function') fn.after();
  if (S.view === 'report') drawCharts();
  window.scrollTo({ top: y });
}

/* شاشة الدخول: تظهر متى وُجدت حسابات ولم يدخل أحد على هذا الجهاز */
let gateUser = '', gateErr = '';
function renderGate() {
  const g = $('#gate');
  if (!S.users.length || me()) { if (g.innerHTML) g.innerHTML = ''; return false; }
  const list = S.users.filter(u => u.active !== false);
  const u = list.find(x => x.id === gateUser);
  g.innerHTML = `<div class="gate"><div class="gatebox">
    <div class="gmark">${svg('book')}</div>
    <h2>${esc(S.settings.shopName || 'دفتر المحل')}</h2>
    <div class="gsub">${u ? 'أدخل رمز ' + esc(u.name) : 'من يستخدم البرنامج على هذا الجهاز؟'}</div>
    ${u ? `
      <div class="pinrow"><input id="gatePin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="••••"></div>
      ${gateErr ? '<div class="hint" style="color:var(--bad);margin-top:9px;text-align:center">' + esc(gateErr) + '</div>' : ''}
      <div class="row" style="margin-top:14px">
        <button class="btn primary grow" style="justify-content:center" data-act="gatepin" type="button">دخول</button>

      </div>`
    : `<div class="userlist">${list.map(x => `
        <button class="userbtn" type="button" data-act="gatepick" data-id="${esc(x.id)}">
          <span class="uav">${esc((x.name || '؟').trim()[0])}</span>
          <span style="min-width:0"><b>${esc(x.name)}</b><small>${esc(roleLabel(x))}</small></span>
          ${x.pinHash ? '<span class="ulock">' + svg('lock') + '</span>' : ''}
        </button>`).join('')}</div>`}
    <div class="hint" style="margin-top:18px;text-align:center">يبقى الحساب مسجّلاً على هذا الجهاز حتى تسجّل الخروج.</div>
  </div></div>`;
  const pin = $('#gatePin');
  if (pin) { setTimeout(() => pin.focus(), 40); pin.onkeydown = e => { if (e.key === 'Enter') handle('gatepin', {}, null); }; }
  return true;
}
function roleLabel(u) {
  if (u.role === 'owner') return 'صاحب المحل — كل الصلاحيات';
  const preset = ROLE_PRESETS.find(r => r.id !== 'owner' && r.perms.length === (u.perms || []).length
    && r.perms.every(p => (u.perms || []).includes(p)));
  return preset ? preset.label : (u.perms || []).length + ' صلاحية';
}

function kpi(list) {
  return '<div class="kpis">' + list.map(k =>
    '<div class="kpi ' + (k.tone || '') + '">' +
      '<div class="top"><div class="k">' + esc(k.k) + '</div>' +
        '<div class="kpi-ic">' + svg(k.i || 'coin') + '</div></div>' +
      '<div class="v">' + k.v + '</div>' +
      (k.s ? '<div class="s">' + k.s + '</div>' : '') + '</div>').join('') + '</div>';
}
/* حالة فارغة بأيقونة وعنوان */
function emptyBox(title, sub, icon) {

}

      ${posMode === 'search' ? `<div class="pad" style="padding-top:0"><div id="posResults">${posResults()}</div></div>` : ''}
    </section>

    <aside class="card invoice">

      ${S.cart.length ? S.cart.map((l, i) => cartLine(l, i)).join('')
        : emptyBox('الفاتورة فارغة', 'اختر صنفاً من القائمة للبدء.', 'inbox')}
      ${S.cart.length ? `
      <div class="pad" style="border-top:1px solid var(--line)">
        <div class="invtot"><span>الإجمالي</span><b>${money(cartTotal)} $</b></div>
        <div class="invtot"><span>التكلفة</span><b>${money(cartCost)} $</b></div>
        <div class="invtot"><span>الربح المتوقع</span><b style="color:var(--good)">${money(cartTotal - cartCost)} $</b></div>
        <div class="invtot big"><span>المطلوب</span><b>${money(cartTotal)} $</b></div>
        <div class="hint" style="margin:2px 0 12px">يعادل <span class="num">${money0(toTRY(cartTotal))}</span> ليرة تركية بسعر ${money0(S.settings.rateTRY)}.</div>
        <button class="btn primary big" data-act="checkout" type="button">${svg('check')} إتمام البيع</button>
      </div>` : ''}
    </aside>
  </div>

  ${todayRets.length ? `<section class="card" style="margin-top:16px">
    <div class="pad" style="padding-bottom:4px"><div class="sec-h" style="margin-bottom:0"><h2>مرتجعات اليوم</h2>
      <div class="row"><span class="pill out">${money(todayRets.reduce((a, x) => a + n(x.total), 0))} $</span>
      ${can('reports') ? '<button class="btn ghost sm" data-act="expret" type="button">تصدير الشهر</button>' : ''}</div></div></div>
    <div class="list">${todayRets.slice().reverse().map(retRow).join('')}</div>
  </section>` : ''}

  <section class="card" style="margin-top:16px">
    <div class="pad" style="padding-bottom:4px"><div class="sec-h" style="margin-bottom:0"><h2>مبيعات اليوم</h2>
      <span class="eyebrow">${td}</span></div></div>
    <div class="list">
      ${mine.length ? mine.slice().reverse().map(saleRow).join('')
        : emptyBox('لا مبيعات اليوم بعد', 'أول فاتورة تسجّلها ستظهر هنا مع اسم البائع ووقت البيع.', 'inbox')}
    </div>
  </section>`;
}
viewPOS.after = () => {
  const q = $('#posq');
  if (q) {
    q.oninput = () => { posQuery = q.value; $('#posResults').innerHTML = posResults(); };
    /* قارئ الباركود يُنهي القراءة بـ Enter: أضف الصنف مباشرة وفرّغ الحقل */
    q.onkeydown = e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const raw = q.value.trim();
      if (!raw) return;
      const hit = findByCode(raw);
      if (hit) { q.value = ''; posQuery = ''; onScanned(raw); return; }
      const m = S.products.filter(p => p.active !== false &&
        (p.name + ' ' + (p.brand || '')).toLowerCase().includes(raw.toLowerCase()));
      if (m.length === 1) { q.value = ''; posQuery = ''; addToCart(m[0].id); toast('أُضيف ' + m[0].name); }
      else toast(m.length ? 'أكثر من نتيجة — اختر من القائمة' : 'لا صنف بهذا الرمز', true);
    };
    if (posMode === 'search') setTimeout(() => q.focus(), 30);
  }
  const gs = $('#pkGroup'), ps = $('#pkProd');
  if (gs && ps) {
    gs.onchange = () => { posGroup = gs.value; posPick = ''; ps.innerHTML = pickProdOptions(); posPick = ps.value; syncPick(); };
    ps.onchange = () => { posPick = ps.value; syncPick(); };
    syncPick();
  }
};

/* أنواع القطع الموجودة فعلاً في الجرد، مع عدد أصنافها */
function groupsInStock() {
  const counts = {};
  S.products.filter(p => p.active !== false).forEach(p => {
    const g = (p.group || inferGroup(p).name);
    counts[g] = (counts[g] || 0) + 1;
  });
  return allGroups().filter(g => counts[g.name]).map(g => ({ g, count: counts[g.name] }));
}
function productsInGroup(name) {
  return S.products.filter(p => p.active !== false && (p.group || inferGroup(p).name) === name);
}
function pickProdOptions() {
  const list = productsInGroup(posGroup);
  if (!list.length) return '<option value="">— لا قطع في هذا النوع —</option>';
  return list.map(p => {
    const stock = isStocked(p) ? ' · الكمية ' + money0(p.qty) : ' · خدمة';
    const label = (p.sku ? p.sku + ' — ' : '') + p.name + (p.brand ? ' ' + p.brand : '') + (p.code ? ' (' + p.code + ')' : '') + stock;
    return `<option value="${esc(p.id)}"${p.id === posPick ? ' selected' : ''}>${esc(label)}</option>`;
  }).join('');
}
function pickPanel() {
  const groups = groupsInStock();
  if (!groups.length) return emptyBox('لا قطع في الجرد بعد',
    can('stock') ? 'أضف أول قطعة من زر «قطعة جديدة للجرد».' : 'اطلب من صاحب المحل إضافة الأصناف.', 'box') +
    (can('stock') ? '<div class="row" style="justify-content:center"><button class="btn primary sm" data-act="newprodquick" type="button">+ قطعة جديدة للجرد</button></div>' : '');
  if (!posGroup || !groups.some(x => x.g.name === posGroup)) posGroup = groups[0].g.name;
  const list = productsInGroup(posGroup);
  if (!posPick || !list.some(p => p.id === posPick)) posPick = list.length ? list[0].id : '';
  return `
    <div class="grid2">
      <div class="f"><label for="pkGroup">نوع القطعة</label>
        <select id="pkGroup">${groups.map(x =>
          `<option value="${esc(x.g.name)}"${x.g.name === posGroup ? ' selected' : ''}>${esc(x.g.name)} (${x.count})</option>`).join('')}</select></div>
      <div class="f"><label for="pkProd">القطعة</label>
        <select id="pkProd">${pickProdOptions()}</select></div>
    </div>
    <div class="grid3" style="margin-top:10px">
      <div class="f"><label for="pkQty">العدد</label><input id="pkQty" type="number" min="1" step="1" value="1"></div>
      <div class="f"><label for="pkPrice">سعر البيع $</label><input id="pkPrice" type="number" step="0.01" value=""></div>
      <div class="f"><label for="pkCost">التكلفة $</label><input id="pkCost" type="number" step="0.01" value=""></div>
    </div>
    <div id="pkInfo" class="hint" style="margin-top:9px"></div>
    <div class="row" style="margin-top:11px">
      <button class="btn primary" data-act="pickadd" type="button">أضف إلى الفاتورة</button>
      ${can('stock') ? '<button class="btn" data-act="newprodquick" type="button">+ قطعة جديدة للجرد</button>' : ''}
    </div>`;
}
/* يملأ السعر والتكلفة وسطر المعلومات من القطعة المختارة */
function syncPick() {
  const p = P(posPick), info = $('#pkInfo');
  const pr = $('#pkPrice'), co = $('#pkCost');
  if (!p) { if (info) info.textContent = 'اختر قطعة من القائمة.'; if (pr) pr.value = ''; if (co) co.value = ''; return; }
  if (pr) pr.value = n(p.price) || '';
  if (co) co.value = n(p.cost);
  if (!info) return;
  const bits = [];
  bits.push('الكود ' + (p.sku || '—'));
  if (p.code) bits.push('رمز المصنّع ' + p.code);
  if (isStocked(p)) bits.push('المتوفر ' + money0(p.qty) + ' قطعة');
  else bits.push('خدمة — تُخصم التكلفة من ' + (SITE(p.siteId) ? SITE(p.siteId).name : 'لا حساب مرتبط'));
  if (!n(p.price)) bits.push('⚠ سعر البيع غير محدّد — أدخله هنا وسيُحفظ للقطعة');
  info.textContent = bits.join(' · ');
}

function posResults() {
  const q = posQuery.trim().toLowerCase();
  let list = S.products.filter(p => p.active !== false);
  if (posCat) list = list.filter(p => p.cat === posCat);
  if (q) list = list.filter(p => (p.name + ' ' + (p.brand || '') + ' ' + (p.code || '') + ' ' + (p.sku || '') + ' ' + (p.barcode || '') + ' ' + (p.group || '') + ' ' + (p.imei || '')).toLowerCase().includes(q));
  else list = list.slice(0, 18);
  if (!list.length) return emptyBox('لا نتائج مطابقة', 'جرّب اسماً آخر، أو أضف بنداً حراً إن كان الصنف غير مسجّل.', 'search');
  return '<div class="results"><div class="pgrid">' + list.slice(0, 80).map(p => {
    const stocked = isStocked(p);
    const qty = n(p.qty);
    const badge = !stocked ? '<span class="pill acc">خدمة</span>'
      : qty <= 0 ? '<span class="pill out">نفد</span>'
      : qty <= n(S.settings.lowStock || 2) ? '<span class="pill low">' + money0(qty) + ' متوفر</span>'
      : '<span class="pill ok">' + money0(qty) + ' متوفر</span>';
    return `<button class="pcard" type="button" data-act="addline" data-id="${p.id}">
      <div class="ptop"><div class="pic">${svg(prodIcon(p))}</div>${badge}</div>
      <div class="pn">${esc(p.name)}${p.brand ? ' ' + esc(p.brand) : ''}</div>
      <div class="pc">${esc(p.sku || p.code || '—')}</div>
      <div class="pf"><span class="pp">${n(p.price) ? money(p.price) + ' $' : '<span style="color:var(--warn);font-family:inherit">حدّد السعر</span>'}</span>
        <span class="add">+</span></div>
    </button>`;
  }).join('') + '</div></div>';
}

function cartLine(l, i) {
  return `<div class="cline">
    <div style="min-width:0">
      <div class="t" style="font-weight:500">${esc(l.name)}</div>
      <div class="m" style="font-size:11.5px;color:var(--muted)">تكلفة الوحدة
        <input class="priceinp" style="width:64px" type="number" step="0.01" data-act="cost" data-i="${i}" value="${l.cost}"> $
        · الربح <span class="num">${money((n(l.price) - n(l.cost)) * n(l.qty))}</span> $</div>
    </div>
    <div style="display:flex;align-items:center;gap:7px">
      <div class="qtybox">
        <button type="button" data-act="qty" data-i="${i}" data-d="-1" aria-label="إنقاص">−</button>
        <input type="number" step="1" min="0" data-act="qtyset" data-i="${i}" value="${l.qty}" aria-label="الكمية">
        <button type="button" data-act="qty" data-i="${i}" data-d="1" aria-label="زيادة">+</button>
      </div>
      <input class="priceinp" type="number" step="0.01" data-act="price" data-i="${i}" value="${l.price}" aria-label="سعر البيع">
      <button class="btn ghost sm" data-act="rmline" data-i="${i}" type="button" aria-label="حذف">✕</button>
    </div>
  </div>`;
}

const RET_MODE = { cash: 'نقداً من الدرج', credit: 'رصيد له عندنا', debt: 'خصم من دينه' };
function retRow(x) {
  return `<div class="item"><span class="rowic" style="background:var(--bad-soft);color:var(--bad)">${svg('back')}</span>
    <span class="grow"><span class="t">${esc((x.lines || []).map(l => l.name + '×' + l.qty).join('، '))}</span>
      <span class="m"><span class="mono">${esc(x.date)} · ${esc(x.time || '')}</span>
        ${x.seller ? '<span class="pill acc">' + esc(x.seller) + '</span>' : ''}
        <span class="pill out">${esc(RET_MODE[x.mode] || (SITE(String(x.mode).slice(5)) ? 'إلى ' + SITE(String(x.mode).slice(5)).name : 'مرتجع'))}</span>
        ${x.partyName ? '<span>' + esc(x.partyName) + '</span>' : ''}
        ${x.note ? '<span>' + esc(x.note) + '</span>' : ''}</span></span>
    <span class="amt" style="color:var(--bad)">−${money(x.total)} $</span></div>`;
}
function saleRow(s) {
  const names = (s.lines || []).map(l => l.name).join('، ');
  const unpaid = n(s.total) - n(s.paid);
  return `<div class="item">
    <span class="stripe ${unpaid > 0 ? 'warn' : 'good'}"></span>
    <span class="grow"><span class="t">${esc(names || 'فاتورة')}</span>
      <span class="m"><span class="mono">${esc(s.date)} · ${esc(s.time || (s.ts || '').slice(11, 16))}</span>
        ${s.seller ? '<span class="pill acc">' + esc(s.seller) + '</span>' : ''}
        <span class="pill ${unpaid > 0 ? 'low' : 'ok'}">${esc(payLabel(s.method))}${s.destId ? ' · ' + esc(s.destName || destName(s.destId)) : ''}</span>
        <span>ربح <span class="num">${money(s.profit)}</span> $</span>
        ${unpaid > 0 ? '<span class="pill low">باقٍ ' + money(unpaid) + ' $ · ' + esc(s.partyName || '—') + '</span>' : ''}
        ${s.note ? '<span>' + esc(s.note) + '</span>' : ''}</span></span>
    <span class="amt">${money(s.total)} $</span>
    ${can('sell') ? '<button class="btn ghost sm" data-act="retsale" data-id="' + s.id + '" type="button" title="مرتجع">' + svg('back') + '</button>' : ''}
    ${can('delete') ? '<button class="btn ghost sm" data-act="delsale" data-id="' + s.id + '" type="button" aria-label="حذف الفاتورة">✕</button>' : ''}
  </div>`;
}
</script>
<script>
/* ---------- 9. الجرد ---------- */
let stockQuery = '', stockCat = '', stockFilter = '', stockGroup = '';

function stockStats() {
  let cost = 0, retail = 0, units = 0, low = 0, out = 0, noPrice = 0;
  S.products.forEach(p => {
    if (!isStocked(p)) { if (!n(p.price)) noPrice++; return; }
    const q = n(p.qty);
    cost += q * n(p.cost); retail += q * n(p.price); units += q;
    if (q <= 0) out++; else if (q <= n(S.settings.lowStock || 2)) low++;
    if (!n(p.price)) noPrice++;
  });
  return { cost: r2(cost), retail: r2(retail), units, low, out, noPrice };
}

function viewStock() {
  const st = stockStats();
  return `
  ${kpi([
    { k: 'قيمة البضاعة بالتكلفة', v: usd(st.cost), s: tryv(toTRY(st.cost)), tone: 'acc', i: 'box' },
    { k: 'قيمتها بسعر البيع', v: usd(st.retail), i: 'bag', tone: 'vio' },
    { k: 'الربح المتوقع من المخزون', v: usd(st.retail - st.cost), tone: 'pos', i: 'trend' },
    { k: 'عدد القطع', v: '<span class="num">' + money0(st.units) + '</span>', s: S.products.length + ' صنف', i: 'clip', tone: 'amb' }
  ])}

  ${st.noPrice ? `<div class="banner warn" style="margin-top:14px">
    <span class="bic">${svg('alert')}</span>
    <span><b>${st.noPrice} صنفاً بلا سعر بيع</b>الربح لا يُحسب لها حتى تُدخل السعر — اضغط على الصنف وأدخل «سعر البيع»، أو أدخله عند أول بيع فيُحفظ تلقائياً.</span></div>` : ''}

  <div class="stack" style="margin-top:14px">
    <section class="card">
      <div class="pad" style="padding-bottom:10px">
        <div class="sec-h"><h2>الأصناف</h2>
          <div class="row">
            <button class="btn primary sm" data-act="bulkprice" type="button">${svg('tag')} تسعير بالجملة</button>
            <button class="btn sm" data-act="stocktake" type="button">وضع الجرد</button>
            <button class="btn sm" data-act="expstock" type="button">تصدير</button>
            <button class="btn primary sm" data-act="newprod" type="button">+ صنف</button>
          </div></div>
        <div class="grid2">
          <div class="f"><label for="stq">بحث</label><input id="stq" type="search" value="${esc(stockQuery)}" placeholder="اسم أو كود أو IMEI" autocomplete="off"></div>
          <div class="f"><label for="stg">نوع القطعة</label><select id="stg">
            <option value="">كل الأنواع</option>
            ${groupsInStock().map(x => `<option value="${esc(x.g.name)}"${x.g.name === stockGroup ? ' selected' : ''}>${esc(x.g.name)} (${x.count})</option>`).join('')}
          </select></div>
        </div>
        <div class="chips" style="margin-top:9px">
          <button class="chip" data-act="stockcat" data-v="" aria-pressed="${stockCat === ''}" type="button">كل الفئات</button>
          ${CATS.map(c => `<button class="chip" data-act="stockcat" data-v="${c.id}" aria-pressed="${stockCat === c.id}" type="button">${c.label}</button>`).join('')}
        </div>
        <div class="chips" style="margin-top:6px">
          <button class="chip" data-act="stockfilter" data-v="" aria-pressed="${stockFilter === ''}" type="button">الكل</button>
          <button class="chip" data-act="stockfilter" data-v="low" aria-pressed="${stockFilter === 'low'}" type="button">قارب على النفاد (${st.low})</button>
          <button class="chip" data-act="stockfilter" data-v="out" aria-pressed="${stockFilter === 'out'}" type="button">نفد (${st.out})</button>
          <button class="chip" data-act="stockfilter" data-v="noprice" aria-pressed="${stockFilter === 'noprice'}" type="button">بلا سعر بيع (${st.noPrice})</button>
        </div>
      </div>
      <div id="stockList">${stockList()}</div>
    </section>

    <section class="card">
      <div class="pad"><div class="sec-h"><h2>شراء بضاعة</h2></div>
      <p class="hint" style="margin:0 0 10px">سجّل البضاعة الواردة: تزيد الكمية، وتُحدَّث تكلفة الصنف بالمتوسط المرجّح، ويُخصم المدفوع من الصندوق.</p>
      <button class="btn primary" data-act="newpurchase" type="button">+ فاتورة شراء</button></div>
      <div class="list">${(book(S.month).purchases || []).slice().reverse().slice(0, 12).map(purchRow).join('') || emptyBox('لا مشتريات هذا الشهر', 'سجّل البضاعة الواردة لتحديث الكميات والتكلفة.', 'box')}</div>
    </section>
  </div>`;
}
viewStock.after = () => {
  const q = $('#stq');
  if (q) q.oninput = () => { stockQuery = q.value; $('#stockList').innerHTML = stockList(); };
  const g = $('#stg');
  if (g) g.onchange = () => { stockGroup = g.value; $('#stockList').innerHTML = stockList(); };
};

function stockList() {
  let list = S.products.slice();
  if (stockGroup) list = list.filter(p => (p.group || inferGroup(p).name) === stockGroup);
  if (stockCat) list = list.filter(p => p.cat === stockCat);
  if (stockFilter === 'low') list = list.filter(p => isStocked(p) && n(p.qty) > 0 && n(p.qty) <= n(S.settings.lowStock || 2));
  if (stockFilter === 'out') list = list.filter(p => isStocked(p) && n(p.qty) <= 0);
  if (stockFilter === 'noprice') list = list.filter(p => !n(p.price));
  const q = stockQuery.trim().toLowerCase();
  if (q) list = list.filter(p => (p.name + ' ' + (p.brand || '') + ' ' + (p.code || '') + ' ' + (p.sku || '') + ' ' + (p.barcode || '') + ' ' + (p.imei || '')).toLowerCase().includes(q));
  return '<div class="list">' +
    (list.length ? list.slice(0, 400).map(prodRow).join('') : emptyBox('لا أصناف مطابقة', 'غيّر البحث أو الفلاتر لعرض أصناف أخرى.', 'search')) + '</div>' +
    (list.length > 400 ? '<div class="empty">تُعرض أول 400 صنف — ضيّق البحث لرؤية الباقي.</div>' : '');
}

function prodRow(p) {
  const stocked = isStocked(p);
  const qty = n(p.qty);
  const st = !stocked ? 'acc' : qty <= 0 ? 'bad' : qty <= n(S.settings.lowStock || 2) ? 'warn' : 'good';
  const margin = n(p.price) - n(p.cost);
  return `<div class="item click" data-act="editprod" data-id="${p.id}">
    <span class="rowic"${st === 'bad' ? ' style="background:var(--bad-soft);color:var(--bad)"' : st === 'warn' ? ' style="background:var(--warn-soft);color:var(--warn)"' : ''}>${svg(prodIcon(p))}</span>
    <span class="grow"><span class="t">${esc(p.name)}${p.brand ? ' <span style="color:var(--muted);font-weight:400">' + esc(p.brand) + '</span>' : ''}</span>
      <span class="m">${p.sku ? '<span class="pill code">' + esc(p.sku) + '</span>' : ''}
        <span>${esc(p.group || catOf(p.cat).label)}</span>
        ${p.code ? '<span class="mono">' + esc(p.code) + '</span>' : ''}
        ${p.imei ? '<span class="mono">IMEI ' + esc(p.imei) + '</span>' : ''}
        ${p.siteId && SITE(p.siteId) ? '<span class="pill acc">' + esc(SITE(p.siteId).name) + '</span>' : ''}
        <span>تكلفة <span class="num">${money(p.cost)}</span></span>
        ${n(p.price) ? '<span>ربح الوحدة <span class="num">' + money(margin) + '</span></span>' : '<span class="pill low">لا سعر بيع</span>'}</span></span>
    <span class="amt">${stocked ? '<span style="font-size:17px">' + money0(qty) + '</span><br><span style="font-size:10.5px;color:var(--muted)">قطعة</span>' : '<span class="pill acc">خدمة</span>'}</span>
  </div>`;
}
function purchRow(x) {
  return `<div class="item"><span class="stripe"></span><span class="grow">
    <span class="t">${esc((x.lines || []).map(l => l.name).join('، ') || 'فاتورة شراء')}</span>

/* ---------- 10. الديون ---------- */
let debtSide = 'us', debtAgeFilter = '';

  const weOwe    = S.parties.filter(p => n(p.bal) < 0);
  const totalIn  = owedToUs.reduce((s, p) => s + n(p.bal), 0);
  const totalOut = weOwe.reduce((s, p) => s - n(p.bal), 0);
  const late = owedToUs.filter(p => (debtAge(p) || 0) >= 60);
  const lateSum = late.reduce((s, p) => s + n(p.bal), 0);
  const over = owedToUs.filter(p => overLimit(p) > 0);
  const counts = {};
  AGE_BUCKETS.forEach(bk => counts[bk.id] = owedToUs.filter(p => (bucketOf(debtAge(p)) || {}).id === bk.id).length);
  const unknown = owedToUs.filter(p => debtAge(p) === null).length;

  let list = (debtSide === 'us' ? owedToUs : weOwe).slice();

    list = list.filter(p => debtAgeFilter === 'over' ? overLimit(p) > 0
      : debtAgeFilter === 'unknown' ? debtAge(p) === null
      : (bucketOf(debtAge(p)) || {}).id === debtAgeFilter);

/* ---------- 10ج. الحماية والنسخ الاحتياطي ---------- */
S.backups = null;
async function ensureBackups() {
  if (S.backups) return;
  S.backups = [];
  const rows = await Store.list('backups');
  S.backups = rows.sort((a, b) => String(b.at || '').localeCompare(String(a.at || '')));
  if (S.view === 'guard') render();
}

/* لقطة البيانات الحيّة: الضبط والأصناف والحسابات ودفاتر آخر شهرين */
async function snapshot() {
  const months = [monthOf(), prevMonth(monthOf())];
  const ledger = {};
  for (const m of months) ledger[m] = await loadMonth(m, true);
  return {
    v: 2, at: new Date().toISOString(), by: who() || '—',
    settings: S.settings, users: S.users, cash: S.cash,
    products: S.products, parties: S.parties, sites: S.sites, ledger
  };
}
function prevMonth(m) {
  const [y, mo] = m.split('-').map(Number);
  const d = new Date(y, mo - 2, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

async function makeBackup(kind) {
  const data = await snapshot();
  const json = JSON.stringify(data);
  if (json.length > 230000) { toast('البيانات أكبر من أن تُحفظ داخل البرنامج — نزّل نسخة على جهازك', true); return null; }
  const id = 'b' + data.at.replace(/[^0-9]/g, '').slice(0, 14);
  await Store.set('backups/' + id, { id, at: data.at, by: data.by, kind, size: json.length, data });
  /* الإبقاء على آخر ثماني نسخ */
  const rows = (await Store.list('backups')).sort((a, b) => String(b.at || '').localeCompare(String(a.at || '')));
  for (const old of rows.slice(8)) await Store.del('backups/' + old.id);
  S.backups = null; await ensureBackups();
  return id;
}

/* نسخة تلقائية واحدة كل يوم، من جهاز صاحب المحل */
let autoTried = false;
async function autoBackup() {
  if (autoTried || !isOwner() || !S.products.length) return;
  autoTried = true;
  await ensureBackups();
  const last = (S.backups || []).find(b => b.kind === 'auto');
  if (last && String(last.at).slice(0, 10) === todayStr()) return;
  if (!(await Store.lease('backups/lock', CLIENT_ID, 120000))) return;
  await makeBackup('auto');
}

async function restoreBackup(id) {
  const b = await Store.get('backups/' + id);
  if (!b || !b.data) { toast('تعذّر قراءة النسخة', true); return; }
  const d = b.data;
  for (const x of (d.products || [])) await Store.set('products/' + x.id, x);
  for (const x of (d.parties  || [])) await Store.set('parties/'  + x.id, x);
  for (const x of (d.sites    || [])) await Store.set('sites/'    + x.id, x);
  if (d.settings) await Store.set('meta/settings', d.settings);
  if (d.users)    await Store.set('meta/users', { list: d.users });
  await Store.set('state/cash', { amount: n(d.cash), at: new Date().toISOString(), by: 'استعادة' });
  for (const m in (d.ledger || {})) {
    for (const coll of BOOKS) await Store.set(coll + '/' + m, { month: m, items: (d.ledger[m][coll] || []) });
  }
  await audit('استعادة نسخة احتياطية', 'نسخة ' + String(b.at).slice(0, 16).replace('T', ' '), { id });
  S.ledger = {}; S.summaries = null; await loadMonth(S.month, true);
  toast('استُعيدت البيانات من النسخة');
  render();
}

/* فحص سلامة البيانات */
function healthChecks() {
  const out = [];
  const add = (sev, title, detail, n2) => out.push({ sev, title, detail, n: n2 });
  const neg = S.products.filter(p => isStocked(p) && n(p.qty) < 0);
  if (neg.length) add('bad', 'أصناف بكمية سالبة', neg.slice(0, 6).map(p => p.name).join('، '), neg.length);
  const noPrice = S.products.filter(p => !n(p.price));
  if (noPrice.length) add('warn', 'أصناف بلا سعر بيع', 'الربح لا يُحسب لها', noPrice.length);
  const under = S.products.filter(p => n(p.price) > 0 && n(p.price) < n(p.cost));
  if (under.length) add('warn', 'أصناف سعر بيعها أقل من تكلفتها', under.slice(0, 6).map(p => p.name).join('، '), under.length);
  const negSite = S.sites.filter(x => n(x.balance) < 0);
  if (negSite.length) add('bad', 'حسابات برصيد سالب', negSite.map(x => x.name).join('، '), negSite.length);
  const b = book(S.month);
  const noSeller = (b.sales || []).filter(x => !x.seller);
  if (noSeller.length) add('warn', 'فواتير بلا اسم بائع', 'في ' + monthLabel(S.month), noSeller.length);
  const lossy = (b.sales || []).filter(x => n(x.profit) < 0);
  if (lossy.length) add('warn', 'فواتير بربح سالب', 'بيع بأقل من التكلفة', lossy.length);
  const zero = (b.expenses || []).filter(x => !n(x.amount));
  if (zero.length) add('warn', 'قيود بمبلغ صفر', 'في ' + monthLabel(S.month), zero.length);
  const wrongSign = S.parties.filter(x => x.kind === 'supplier' && n(x.bal) > 0);
  if (wrongSign.length) add('warn', 'موردون برصيد لنا عليهم', wrongSign.map(x => x.name).join('، '), wrongSign.length);
  if (!S.users.length) add('warn', 'لا حسابات مستخدمين', 'البرنامج مفتوح لكل من يفتح الرابط', 0);
  if (S.users.filter(u => u.active !== false && !u.pinHash).length)
    add('warn', 'حسابات بلا رمز دخول', 'يفتحها أي شخص على الجهاز', S.users.filter(u => u.active !== false && !u.pinHash).length);
  return out;
}
