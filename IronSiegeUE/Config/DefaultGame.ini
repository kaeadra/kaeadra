[/Script/UnrealEd.ProjectPackagingSettings]
BuildConfiguration=PPBC_Development
Build=IfProjectHasCode
+DirectoriesToAlwaysStageAsNonUFS=(Path="IronSiege/Characters")

; The engine only writes the sections of Game.ini it is told to (Base.ini: bCanSaveAllSections=false).
; Without these the survival records and the campaign progress were set in memory and never reached
; the disk: every launch started from zero.
[SectionsToSave]
+Section=IronSiege.Records
+Section=IronSiege.Campaign
