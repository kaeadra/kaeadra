[/Script/Engine.RendererSettings]
; Lumen (GI method 1 / Reflection method 1) needs Mesh Distance Fields + Surface Cache to
; finish an async build before it produces any lit image at all - on this machine (4GB VRAM,
; confirmed via LogD3D12RHI) that warmup measured 30-60+ seconds, during which the whole scene
; renders pure black. That is not viable for normal play, so this project uses the classic
; dynamic-only pipeline instead: GI method 0 = None (fully dynamic direct lighting, no baked
; lightmaps since AllowStaticLighting stays False), Reflection method 0 = screen-space
; reflections. Confirmed via a real -game run that direct lighting is then immediate.
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.GenerateMeshDistanceFields=False
r.AllowStaticLighting=False
r.VirtualTextures=True

[ConsoleVariables]
; City Sample content (built for high-end demo hardware) exceeds this machine's VRAM budget
; when loaded at full texture resolution. Cap the streaming pool so the engine gracefully drops
; mip levels to stay in budget instead of overflowing (blurrier at distance, but stable).
r.Streaming.PoolSize=1500
r.Streaming.PoolSizeVRAMPercentage=0

